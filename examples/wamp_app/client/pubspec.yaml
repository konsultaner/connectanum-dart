name: wamp_app
description: A Flutter messaging example built on the public Connectanum packages.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.1

dependencies:
  audioplayers: ^6.8.1
  connectanum_client: 3.0.0-beta.2
  connectanum_core: 3.0.0-beta.2
  crypto: ^3.0.7
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4
  cupertino_icons: ^1.0.8
  file_selector: ^1.1.0
  firebase_core: 4.14.0
  firebase_messaging: 16.6.0
  flutter:
    sdk: flutter
  flutter_contacts: 2.3.1
  flutter_webrtc: ^1.6.0
  idb_shim: ^2.9.8
  path: ^1.9.1
  path_provider: ^2.1.6
  pinenacl: ^0.6.0
  record: ^7.1.1
  shared_preferences: ^2.5.3
  web: ^1.1.1
  wamp_app_protocol:
    path: ../shared

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  wamp_app_server:
    path: ../server

flutter:
  uses-material-design: true
