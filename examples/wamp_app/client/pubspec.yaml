name: wamp_app
description: A Flutter messaging example built on the public Connectanum packages.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.1

dependencies:
  connectanum_client: 3.0.0-beta.2
  connectanum_core: 3.0.0-beta.2
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  wamp_app_protocol:
    path: ../shared

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
