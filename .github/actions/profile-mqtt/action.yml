name: Capture native MQTT CPU profiles
description: Capture diagnostic AOT CPU samples without changing MQTT acceptance measurements
runs:
  using: composite
  steps:
    - name: Install perf and capture kernel identity
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p out/mqtt-native-profile
        uname -a > out/mqtt-native-profile/kernel.txt
        sudo apt-get install -y linux-tools-common linux-tools-generic
        sudo sysctl -w kernel.perf_event_paranoid=-1
    - name: Profile WebSocket and large TCP payloads
      shell: bash
      run: |
        set -euo pipefail
        perf_binary="$(find -L /usr/lib/linux-tools -type f -name perf | sort -V | tail -1)"
        [[ -n "$perf_binary" && -x "$perf_binary" ]]
        "$perf_binary" --version > out/mqtt-native-profile/perf-version.txt
        failed=0
        for profile in ws_sustained 64k_sustained; do
          if ! python3 tool/profile_mqtt_native.py --perf "$perf_binary" \
            --budget "tool/mqtt_native_${profile}_benchmark_budget.json" \
            --output "out/mqtt-native-profile/$profile" \
            > "out/mqtt-native-profile/$profile.log" 2>&1; then
            failed=1
          fi
        done
        exit "$failed"
