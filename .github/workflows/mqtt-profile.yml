name: MQTT Python tracing comparison

on:
  workflow_dispatch:
    inputs:
      target_cpu:
        description: Measure on EPYC 7763 or Intel 8370C; retain the actual CPU class
        type: choice
        required: true
        default: either
        options: [either, '7763', 8370C]

concurrency:
  group: mqtt-orchestration-${{ github.ref }}-${{ inputs.target_cpu }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  compare:
    name: MQTT tracing A/B probe ${{ matrix.probe }}
    strategy:
      fail-fast: false
      matrix:
        probe: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      REQUESTED_CPU: ${{ inputs.target_cpu }}
    steps:
      - uses: actions/checkout@v5
      - name: Require the requested hardware before timing
        id: cpu
        env:
          MQTT_CPU_INFO_PATH: /proc/cpuinfo
        run: |
          set -euo pipefail
          mkdir -p out/mqtt-orchestration-ab
          cpu_model="$(awk -F: '/^model name/ {sub(/^ /,"",$2); print $2; exit}' "${MQTT_CPU_INFO_PATH:-/proc/cpuinfo}")"
          model_lower="$(printf '%s' "$cpu_model" | tr '[:upper:]' '[:lower:]')"
          actual_class=other
          if [[ "$model_lower" == *amd* && "$model_lower" == *7763* ]]; then actual_class=7763; fi
          if [[ "$model_lower" == *intel* && "$model_lower" == *8370c* ]]; then actual_class=8370C; fi
          matched=false
          case "$REQUESTED_CPU" in
            either) if [[ "$actual_class" != other ]]; then matched=true; fi ;;
            7763|8370C) if [[ "$actual_class" == "$REQUESTED_CPU" ]]; then matched=true; fi ;;
            *) echo 'Unsupported requested CPU class' >&2; exit 2 ;;
          esac
          printf '%s\n' "$cpu_model" > out/mqtt-orchestration-ab/cpu-model.txt
          uname -srm > out/mqtt-orchestration-ab/kernel.txt
          printf 'matches=%s\nactual_class=%s\n' "$matched" "$actual_class" >> "$GITHUB_OUTPUT"
          printf '{"requested_cpu":"%s","actual_cpu_class":"%s","matched_requested_cpu":%s,"benchmark_executed":false}\n' "$REQUESTED_CPU" "$actual_class" "$matched" > out/mqtt-orchestration-ab/status.json
          echo "Requested $REQUESTED_CPU matched: $matched ($cpu_model)"
      - uses: ./.github/actions/setup-ci
        if: ${{ steps.cpu.outputs.matches == 'true' }}
        with:
          rust: 'true'
      - name: Bootstrap and install the independent reference
        if: ${{ steps.cpu.outputs.matches == 'true' }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y mosquitto
          version="$(mosquitto -h 2>&1 || true)"
          [[ "$version" == *'mosquitto version 2.0.18'* ]]
          bin/bootstrap
          python3 -m venv "$RUNNER_TEMP/mqtt-tracing"
          "$RUNNER_TEMP/mqtt-tracing/bin/pip" install coverage==7.16.2
          echo "PYTHONPATH=tool" >> "$GITHUB_ENV"
          echo "COVERAGE_FILE=$RUNNER_TEMP/mqtt-tracing-coverage" >> "$GITHUB_ENV"
      - name: Build one unchanged production library
        if: ${{ steps.cpu.outputs.matches == 'true' }}
        run: |
          set -euo pipefail
          CARGO_TARGET_DIR="$RUNNER_TEMP/mqtt-native-target" \
            cargo build --manifest-path native/transport/Cargo.toml -p ct_ffi --release --features ffi-test --locked
          {
            git rev-parse HEAD
            rustc -Vv
            dart --version
            sha256sum native/transport/Cargo.lock native/transport/ct_core/src/lib.rs \
              "$RUNNER_TEMP/mqtt-native-target/release/libct_ffi.so"
            lscpu
          } > out/mqtt-orchestration-ab/build-provenance.txt
      - name: Run coverage controls, then paired untraced and traced profiles
        if: ${{ steps.cpu.outputs.matches == 'true' }}
        env:
          ACTUAL_CPU_CLASS: ${{ steps.cpu.outputs.actual_class }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/mqtt-tracing/bin/coverage" run --source=run_mqtt_benchmark_gate \
            -m unittest tool/test_run_mqtt_benchmark_gate.py
          result=0
          bash tool/compare_mqtt_orchestration.sh \
            "$RUNNER_TEMP/mqtt-native-target/release/libct_ffi.so" \
            "$RUNNER_TEMP/mqtt-tracing" out/mqtt-orchestration-ab/comparison || result=$?
          "$RUNNER_TEMP/mqtt-tracing/bin/coverage" report --fail-under=100 -m \
            > out/mqtt-orchestration-ab/coverage.txt || result=1
          passed=false
          if [[ "$result" -eq 0 ]]; then passed=true; fi
          printf '{"requested_cpu":"%s","actual_cpu_class":"%s","matched_requested_cpu":true,"benchmark_executed":true,"all_profiles_passed":%s}\n' "$REQUESTED_CPU" "$ACTUAL_CPU_CLASS" "$passed" > out/mqtt-orchestration-ab/status.json
          exit "$result"
      - name: Preserve all raw measurements, including failing gates
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mqtt-orchestration-comparison-${{ matrix.probe }}
          path: out/mqtt-orchestration-ab
          if-no-files-found: error
