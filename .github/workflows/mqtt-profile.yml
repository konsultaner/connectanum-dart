name: MQTT CPU clock calibration
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  clock:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Compare process CPU clock and proc ticks without altering gates
        run: |
          set -euo pipefail
          mkdir -p out/mqtt-cpu-clock
          python3 tool/probe_mqtt_cpu_clock.py > out/mqtt-cpu-clock/clock.json
          python3 --version > out/mqtt-cpu-clock/python.txt
          uname -srm > out/mqtt-cpu-clock/kernel.txt
      - name: Preserve calibration evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mqtt-cpu-clock-calibration
          path: out/mqtt-cpu-clock
          if-no-files-found: error
