name: MQTT peer-close allocator qualification
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  CI: true
jobs:
  native-build:
    name: ${{ matrix.variant }} ffi-test Build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: candidate
            source: ''
            artifact: mqtt-gateway-native-ffi-test
          - variant: baseline
            source: 6d48d9b9bb39abe6d068b664aaf15f34f2d3ca46
            artifact: mqtt-gateway-baseline-native-ffi-test
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.source || github.sha }}
      - uses: ./.github/actions/setup-ci
        with:
          rust: 'true'
      - id: rust
        run: echo "identity=$(rustc -Vv | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: native/transport/target/ffi-test
          key: ffi-test-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.identity }}-${{ hashFiles('native/transport/**', 'bin/common.sh') }}
          restore-keys: ffi-test-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.identity }}-
      - name: Build and record the same-run ffi-test library
        run: |
          set -euo pipefail
          source bin/common.sh
          build_native_ffi_test_release
          python3 tool/ci_native_artifact.py record --directory out/ci-native \
            --library "$CONNECTANUM_NATIVE_LIB"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: out/ci-native
          if-no-files-found: error

  handoff-regression:
    name: Gateway slow-peer regression
    needs: native-build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-ci
        with:
          rust: 'true'
      - uses: actions/download-artifact@v8
        with:
          name: mqtt-gateway-native-ffi-test
          path: out/ci-native
      - name: Prepare current source and run the exact slow-peer regression
        run: |
          set -euo pipefail
          python3 tool/ci_native_artifact.py prepare --directory out/ci-native
          export CONNECTANUM_NATIVE_LIB="$PWD/out/ci-native/libct_ffi.so"
          bin/bootstrap
          python3 -m venv "$RUNNER_TEMP/handoff-python"
          "$RUNNER_TEMP/handoff-python/bin/pip" install paho-mqtt==2.1.0
          export PAHO_PYTHON="$RUNNER_TEMP/handoff-python/bin/python"
          "$PAHO_PYTHON" tool/mqtt_gateway_handoff_regression.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mqtt-fanout-regression
          path: out/mqtt-handoff-regression
          if-no-files-found: error

  release:
    name: Gateway release ${{ matrix.shard }}
    needs: native-build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [5]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-ci
        with:
          rust: 'true'
      - uses: actions/download-artifact@v8
        with:
          name: mqtt-gateway-native-ffi-test
          path: out/ci-native
      - name: Verify native sources and prepare the workspace
        run: |
          set -euo pipefail
          python3 tool/ci_native_artifact.py prepare --directory out/ci-native
          echo "CONNECTANUM_NATIVE_LIB=$PWD/out/ci-native/libct_ffi.so" >> "$GITHUB_ENV"
          bin/bootstrap
      - uses: ./.github/actions/profile-mqtt-gateway
        with:
          shard: ${{ matrix.shard }}/16
          record_only: 'false'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mqtt-wamp-gateway-${{ matrix.shard }}
          path: out/mqtt-gateway
          if-no-files-found: error

  pair:
    name: Same-host peer-close allocator comparison
    needs: native-build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-ci
        with:
          rust: 'true'
      - uses: actions/download-artifact@v8
        with:
          name: mqtt-gateway-native-ffi-test
          path: out/ci-native
      - uses: actions/download-artifact@v8
        with:
          name: mqtt-gateway-baseline-native-ffi-test
          path: out/baseline-native
      - name: Compare exact baseline and candidate with their own native libraries
        run: |
          set -euo pipefail
          python3 tool/ci_native_artifact.py prepare --directory out/ci-native
          export CONNECTANUM_NATIVE_LIB="$PWD/out/ci-native/libct_ffi.so"
          bin/bootstrap
          python3 tool/mqtt_gateway_peer_idle_pair.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mqtt-gateway-peer-idle-pair
          path: out/mqtt-peer-idle-pair
          if-no-files-found: error

  native-coverage:
    name: Source-matched native added-line coverage
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-ci
        with:
          rust: 'true'
          native-tools: 'true'
      - run: bin/bootstrap
      - name: Collect complete Cargo and Dart FFI native coverage
        run: |
          set -euo pipefail
          bin/test-native-coverage
          bin/test-native-ffi-coverage
          GATEWAY_NATIVE_CARGO=out/coverage-native \
          GATEWAY_NATIVE_FFI=out/coverage-native-ffi \
          GATEWAY_NATIVE_OUTPUT=out/native-added-proof \
          GATEWAY_NATIVE_PUBLISH=1 \
            python3 tool/mqtt_gateway_native_added_line_proof.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mqtt-gateway-peer-idle-native-coverage
          path: |
            out/coverage-native
            out/coverage-native-ffi
            out/native-added-proof
          if-no-files-found: error
