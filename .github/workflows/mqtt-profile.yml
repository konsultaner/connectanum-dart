name: MQTT CPU diagnostics

on:
  pull_request:
    paths:
      - 'tool/profile_mqtt_native.py'
      - 'tool/test_profile_mqtt_native.py'
      - '.github/actions/profile-mqtt/**'
      - '.github/workflows/mqtt-profile.yml'
  workflow_dispatch:
    inputs:
      recover_run:
        description: Optional run ID whose mqtt-native-profile artifact should be rendered without resampling
        required: false
        default: ''
        type: string
      probe_intel:
        description: Seek Xeon 8370C on Ubuntu 22.04 hosts with pinned Ubuntu 24.04 benchmark userland
        required: false
        default: false
        type: boolean
      compare_workers:
        description: Optional candidate native worker count for same-binary comparisons against automatic sizing
        required: false
        default: ''
        type: string

      source_baseline_ref:
        description: Full baseline commit for a controlled Dart broker comparison
        required: false
        default: ''
        type: string
      source_candidate_ref:
        description: Full candidate commit for the same-runner broker comparison
        required: false
        default: ''
        type: string
      source_locks_run:
        description: Completed candidate copy/lifetime run retaining canonical lockfiles
        required: false
        default: ''
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ (inputs.source_baseline_ref != '' || inputs.source_candidate_ref != '' || inputs.source_locks_run != '') && github.run_id || github.ref }}
  cancel-in-progress: ${{ inputs.source_baseline_ref == '' && inputs.source_candidate_ref == '' && inputs.source_locks_run == '' }}

permissions:
  contents: read
  actions: read

jobs:
  source-comparison:
    if: ${{ inputs.source_baseline_ref != '' || inputs.source_candidate_ref != '' || inputs.source_locks_run != '' }}
    name: Controlled MQTT broker source comparison (diagnostic only)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_BASELINE_REF: ${{ inputs.source_baseline_ref }}
      SOURCE_CANDIDATE_REF: ${{ inputs.source_candidate_ref }}
      SOURCE_LOCKS_RUN: ${{ inputs.source_locks_run }}
      SOURCE_OUTPUT: out/mqtt-source-comparison
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Validate mutually exclusive diagnostic inputs
        env:
          RECOVER_RUN: ${{ inputs.recover_run }}
          COMPARE_WORKERS: ${{ inputs.compare_workers }}
          PROBE_INTEL: ${{ inputs.probe_intel }}
        run: |
          set -euo pipefail
          if ! [[ "$SOURCE_BASELINE_REF" =~ ^[0-9a-f]{40}$ &&
                  "$SOURCE_CANDIDATE_REF" =~ ^[0-9a-f]{40}$ &&
                  "$SOURCE_BASELINE_REF" != "$SOURCE_CANDIDATE_REF" &&
                  "$SOURCE_LOCKS_RUN" =~ ^[0-9]+$ &&
                  -z "$RECOVER_RUN" && -z "$COMPARE_WORKERS" && "$PROBE_INTEL" != true ]]; then
            echo 'Require two distinct full source revisions and one candidate lock-evidence run; diagnostic modes cannot be combined.' >&2
            exit 2
          fi
      - uses: ./.github/actions/setup-ci
        with:
          rust: 'true'
      - name: Verify comparison contracts
        run: |
          set -euo pipefail
          python3 tool/test_compare_mqtt_brokers.py
          python3 tool/test_prepare_mqtt_comparison_locks.py
      - name: Retain exact sources and canonical candidate locks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$SOURCE_OUTPUT/sources" "$SOURCE_OUTPUT/locks"
          git worktree add --detach "$RUNNER_TEMP/mqtt-source-baseline" "$SOURCE_BASELINE_REF"
          git worktree add --detach "$RUNNER_TEMP/mqtt-source-candidate" "$SOURCE_CANDIDATE_REF"
          git archive --format=tar "$SOURCE_BASELINE_REF" | gzip -n > "$SOURCE_OUTPUT/sources/baseline.tar.gz"
          git archive --format=tar "$SOURCE_CANDIDATE_REF" | gzip -n > "$SOURCE_OUTPUT/sources/candidate.tar.gz"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_LOCKS_RUN" > "$SOURCE_OUTPUT/lock-source-run.json"
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          run = json.loads((Path(os.environ['SOURCE_OUTPUT']) / 'lock-source-run.json').read_text())
          assert run['head_sha'] == os.environ['SOURCE_CANDIDATE_REF']
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          assert run['path'] == '.github/workflows/wamp-profile-benchmarks.yml'
          assert isinstance(run['run_attempt'], int) and run['run_attempt'] > 0
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write(f"SOURCE_LOCKS_ATTEMPT={run['run_attempt']}\n")
          PYTHON
          SOURCE_LOCKS_ATTEMPT="$(python3 -c 'import json,os;from pathlib import Path;print(json.loads((Path(os.environ["SOURCE_OUTPUT"])/"lock-source-run.json").read_text())["run_attempt"])')"
          gh run download "$SOURCE_LOCKS_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "wamp-native-ppt-view-diagnostic-$SOURCE_CANDIDATE_REF-$SOURCE_LOCKS_ATTEMPT" \
            --dir "$RUNNER_TEMP/mqtt-source-lock-evidence"
          python3 tool/prepare_mqtt_comparison_locks.py \
            --evidence "$RUNNER_TEMP/mqtt-source-lock-evidence" \
            --candidate-ref "$SOURCE_CANDIDATE_REF" \
            --baseline "$RUNNER_TEMP/mqtt-source-baseline" \
            --candidate "$RUNNER_TEMP/mqtt-source-candidate" \
            --receipt "$SOURCE_OUTPUT/lock-receipt.json"
          cp "$RUNNER_TEMP/mqtt-source-candidate/pubspec.lock" "$SOURCE_OUTPUT/locks/pubspec.lock"
          cp "$RUNNER_TEMP/mqtt-source-candidate/native/transport/Cargo.lock" "$SOURCE_OUTPUT/locks/transport-Cargo.lock"
          cp "$RUNNER_TEMP/mqtt-source-candidate/native/bench/Cargo.lock" "$SOURCE_OUTPUT/locks/bench-Cargo.lock"
      - name: Bootstrap exact source worktrees without changing locks
        run: |
          set -euo pipefail
          (cd "$RUNNER_TEMP/mqtt-source-baseline" && bin/bootstrap) > "$SOURCE_OUTPUT/baseline-bootstrap.log" 2>&1
          (cd "$RUNNER_TEMP/mqtt-source-candidate" && bin/bootstrap) > "$SOURCE_OUTPUT/candidate-bootstrap.log" 2>&1
          python3 tool/prepare_mqtt_comparison_locks.py --verify \
            --evidence "$RUNNER_TEMP/mqtt-source-lock-evidence" \
            --candidate-ref "$SOURCE_CANDIDATE_REF" \
            --baseline "$RUNNER_TEMP/mqtt-source-baseline" \
            --candidate "$RUNNER_TEMP/mqtt-source-candidate" \
            --receipt "$SOURCE_OUTPUT/lock-receipt.json"
      - name: Build one standard native library for both broker sources
        run: |
          set -euo pipefail
          [[ -z "${RUSTFLAGS:-}" && -z "${CARGO_ENCODED_RUSTFLAGS:-}" ]]
          python3 - <<'PYTHON'
          import os
          assert not any(value for key, value in os.environ.items() if key.startswith('CARGO_PROFILE_'))
          PYTHON
          mkdir -p "$SOURCE_OUTPUT/native"
          CARGO_TARGET_DIR="$RUNNER_TEMP/mqtt-source-native" \
            cargo build --manifest-path "$RUNNER_TEMP/mqtt-source-candidate/native/transport/Cargo.toml" \
            -p ct_ffi --release --features ffi-test --locked \
            > "$SOURCE_OUTPUT/native-build.log" 2>&1
          cp "$RUNNER_TEMP/mqtt-source-native/release/libct_ffi.so" "$SOURCE_OUTPUT/native/libct_ffi.so"
      - name: Capture all predeclared matched source pairs
        run: |
          set -euo pipefail
          python3 tool/compare_mqtt_brokers.py \
            --baseline "$RUNNER_TEMP/mqtt-source-baseline" --baseline-ref "$SOURCE_BASELINE_REF" \
            --candidate "$RUNNER_TEMP/mqtt-source-candidate" --candidate-ref "$SOURCE_CANDIDATE_REF" \
            --native-lib "$SOURCE_OUTPUT/native/libct_ffi.so" \
            --output "$SOURCE_OUTPUT/capture"
      - name: Upload complete diagnostic source comparison
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mqtt-source-comparison
          path: out/mqtt-source-comparison
          if-no-files-found: error

  profile:
    if: ${{ inputs.probe_intel != true && inputs.source_baseline_ref == '' && inputs.source_candidate_ref == '' && inputs.source_locks_run == '' }}
    name: MQTT native CPU diagnostic
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Validate diagnostic mode
        env:
          RECOVER_RUN: ${{ inputs.recover_run }}
          COMPARE_WORKERS: ${{ inputs.compare_workers }}
        run: |
          set -euo pipefail
          if [[ -n "$RECOVER_RUN" && -n "$COMPARE_WORKERS" ]]; then
            echo 'Recovery and worker comparison are separate diagnostic modes.' >&2
            exit 2
          fi
      - uses: ./.github/actions/setup-ci
        with:
          rust: ${{ inputs.recover_run == '' && 'true' || 'false' }}
      - name: Bootstrap diagnostic dependencies
        if: ${{ inputs.recover_run == '' }}
        run: |
          set -euo pipefail
          bin/bootstrap
          sudo apt-get update
          sudo apt-get install -y mosquitto
      - name: Build the native library used by the acceptance gate
        if: ${{ inputs.recover_run == '' }}
        run: |
          set -euo pipefail
          CARGO_TARGET_DIR="$RUNNER_TEMP/mqtt-profile-target" \
            cargo build --manifest-path native/transport/Cargo.toml \
            -p ct_ffi --release --features ffi-test
          echo "CONNECTANUM_NATIVE_LIB=$RUNNER_TEMP/mqtt-profile-target/release/libct_ffi.so" >> "$GITHUB_ENV"
      - name: Recover the original profile artifact
        if: ${{ inputs.recover_run != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVER_RUN: ${{ inputs.recover_run }}
        run: |
          set -euo pipefail
          [[ "$RECOVER_RUN" =~ ^[0-9]+$ ]]
          gh run download "$RECOVER_RUN" --repo "$GITHUB_REPOSITORY" \
            --name mqtt-native-profile --dir out/mqtt-native-profile
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RECOVER_RUN" \
            > out/mqtt-native-profile/recovery-source-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RECOVER_RUN/artifacts" \
            > out/mqtt-native-profile/recovery-source-artifacts.json
      - name: Compare worker policies with identical native binaries
        if: ${{ inputs.compare_workers != '' }}
        env:
          MQTT_COMPARE_WORKER_THREADS: ${{ inputs.compare_workers }}
        run: |
          bash tool/compare_mqtt_native.sh "$CONNECTANUM_NATIVE_LIB" \
            "$CONNECTANUM_NATIVE_LIB" out/mqtt-native-comparison
      - uses: ./.github/actions/profile-mqtt
        if: ${{ inputs.compare_workers == '' }}
        with:
          report_only: ${{ inputs.recover_run != '' && 'true' || 'false' }}
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.compare_workers == '' && 'mqtt-native-profile' || 'mqtt-native-comparison' }}
          path: ${{ inputs.compare_workers == '' && 'out/mqtt-native-profile' || 'out/mqtt-native-comparison' }}
          if-no-files-found: error

  intel:
    if: ${{ inputs.probe_intel == true && inputs.source_baseline_ref == '' && inputs.source_candidate_ref == '' && inputs.source_locks_run == '' }}
    name: Intel 8370C MQTT availability and comparison
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    container:
      image: ubuntu:24.04@sha256:78d4744ead1f5b19b04d0df558ab182a5300903900755e515b2ca4d10eb2044d
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
    steps:
      - name: Identify the requested Intel hardware
        id: cpu
        env:
          INTEL_PROBE_OUTPUT: ${{ runner.temp }}/mqtt-intel-proof
          MQTT_CPU_INFO_PATH: /proc/cpuinfo
          RECOVER_RUN: ${{ inputs.recover_run }}
          COMPARE_WORKERS: ${{ inputs.compare_workers }}
        run: |
          set -euo pipefail
          if [[ -n "$RECOVER_RUN" || -n "$COMPARE_WORKERS" ]]; then
            echo 'Intel hardware probing is separate from recovery and worker comparisons.' >&2
            exit 2
          fi
          mkdir -p "$INTEL_PROBE_OUTPUT"
          cpu_model=''
          while IFS=: read -r key value; do
            if [[ "$key" == 'model name'* ]]; then
              cpu_model="${value# }"
              break
            fi
          done < "${MQTT_CPU_INFO_PATH:-/proc/cpuinfo}"
          printf '%s\n' "$cpu_model" > "$INTEL_PROBE_OUTPUT/cpu-model.txt"
          uname -a > "$INTEL_PROBE_OUTPUT/kernel.txt"
          matched=false
          if [[ "$cpu_model" == *Intel* && "$cpu_model" == *8370C* ]]; then matched=true; fi
          printf 'matches=%s\n' "$matched" >> "$GITHUB_OUTPUT"
          printf '{"matched_intel_8370c":%s,"benchmark_executed":false}\n' "$matched" \
            > "$INTEL_PROBE_OUTPUT/status.json"
          echo "Requested Intel 8370C matched: $matched ($cpu_model)"
      - name: Install pinned-userland benchmark dependencies
        if: ${{ steps.cpu.outputs.matches == 'true' }}
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            ca-certificates curl git unzip build-essential pkg-config libssl-dev \
            python3 procps mosquitto
          version="$(mosquitto -h 2>&1 || true)"
          [[ "$version" == *'mosquitto version 2.0.18'* ]]
      - uses: actions/checkout@v5
        if: ${{ steps.cpu.outputs.matches == 'true' }}
      - uses: dart-lang/setup-dart@v1
        if: ${{ steps.cpu.outputs.matches == 'true' }}
        with:
          sdk: 3.13.1
          problem-matcher: 'false'
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ steps.cpu.outputs.matches == 'true' }}
        with:
          toolchain: 1.99.0
      - name: Compare baseline and candidate on the matching CPU
        if: ${{ steps.cpu.outputs.matches == 'true' }}
        env:
          INTEL_PROBE_OUTPUT: ${{ runner.temp }}/mqtt-intel-proof
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bin/bootstrap
          baseline_ref=e7e9585dce0d366d62706ed602356af08581083c
          git fetch --no-tags origin "$baseline_ref"
          git worktree add --detach "$RUNNER_TEMP/mqtt-intel-baseline" "$baseline_ref"
          cp native/transport/Cargo.lock "$RUNNER_TEMP/mqtt-intel-baseline/native/transport/Cargo.lock"
          CARGO_TARGET_DIR="$RUNNER_TEMP/mqtt-intel-candidate-target" \
            cargo build --manifest-path native/transport/Cargo.toml -p ct_ffi --release --features ffi-test --locked
          CARGO_TARGET_DIR="$RUNNER_TEMP/mqtt-intel-baseline-target" \
            cargo build --manifest-path "$RUNNER_TEMP/mqtt-intel-baseline/native/transport/Cargo.toml" \
            -p ct_ffi --release --features ffi-test --locked
          printf '%s\n' "$baseline_ref" > "$INTEL_PROBE_OUTPUT/baseline-ref.txt"
          git rev-parse HEAD > "$INTEL_PROBE_OUTPUT/candidate-ref.txt"
          result=0
          bash tool/compare_mqtt_native.sh \
            "$RUNNER_TEMP/mqtt-intel-baseline-target/release/libct_ffi.so" \
            "$RUNNER_TEMP/mqtt-intel-candidate-target/release/libct_ffi.so" \
            "$INTEL_PROBE_OUTPUT/comparison" || result=$?
          passed=false
          if [[ "$result" -eq 0 ]]; then passed=true; fi
          printf '{"matched_intel_8370c":true,"benchmark_executed":true,"passed":%s}\n' "$passed" \
            > "$INTEL_PROBE_OUTPUT/status.json"
          exit "$result"
      - name: Upload hardware identity and comparison evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mqtt-intel-proof
          path: ${{ runner.temp }}/mqtt-intel-proof
          if-no-files-found: error
