name: MQTT reader Linux comparison

on:
  workflow_dispatch:
    inputs:
      target_cpu:
        description: Measure either needed CPU class or request one explicitly; always record the actual class
        type: choice
        required: true
        default: either
        options: [either, 9V74, 8370C]

concurrency:
  group: mqtt-reader-linux-${{ github.ref }}-${{ inputs.target_cpu }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  compare:
    name: MQTT reader boundary A/B with unchanged budgets
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      REQUESTED_CPU: ${{ inputs.target_cpu }}
    steps:
      - uses: actions/checkout@v5
      - name: Require the requested hardware before timing
        id: cpu
        env:
          MQTT_CPU_INFO_PATH: /proc/cpuinfo
        run: |
          set -euo pipefail
          mkdir -p out/mqtt-reader-linux
          cpu_model="$(awk -F: '/^model name/ {sub(/^ /,"",$2); print $2; exit}' "${MQTT_CPU_INFO_PATH:-/proc/cpuinfo}")"
          model_lower="$(printf '%s' "$cpu_model" | tr '[:upper:]' '[:lower:]')"
          actual_class=other
          if [[ "$model_lower" == *amd* && "$model_lower" == *9v74* ]]; then actual_class=9V74; fi
          if [[ "$model_lower" == *intel* && "$model_lower" == *8370c* ]]; then actual_class=8370C; fi
          matched=false
          case "$REQUESTED_CPU" in
            either) if [[ "$actual_class" != other ]]; then matched=true; fi ;;
            9V74|8370C) if [[ "$actual_class" == "$REQUESTED_CPU" ]]; then matched=true; fi ;;
            *) echo 'Unsupported requested CPU class' >&2; exit 2 ;;
          esac
          printf '%s\n' "$cpu_model" > out/mqtt-reader-linux/cpu-model.txt
          uname -srm > out/mqtt-reader-linux/kernel.txt
          printf 'matches=%s\nactual_class=%s\n' "$matched" "$actual_class" >> "$GITHUB_OUTPUT"
          printf '{"requested_cpu":"%s","actual_cpu_class":"%s","matched_requested_cpu":%s,"benchmark_executed":false}\n' "$REQUESTED_CPU" "$actual_class" "$matched" > out/mqtt-reader-linux/status.json
          echo "Requested $REQUESTED_CPU matched: $matched ($cpu_model)"
      - uses: ./.github/actions/setup-ci
        if: ${{ steps.cpu.outputs.matches == 'true' }}
        with:
          rust: 'true'
      - name: Bootstrap and install the independent reference
        if: ${{ steps.cpu.outputs.matches == 'true' }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y mosquitto
          version="$(mosquitto -h 2>&1 || true)"
          [[ "$version" == *'mosquitto version 2.0.18'* ]]
          bin/bootstrap
      - name: Build the reactor baseline and boundary-only candidate
        if: ${{ steps.cpu.outputs.matches == 'true' }}
        run: |
          set -euo pipefail
          mkdir -p out/mqtt-reader-linux
          baseline_ref=ffc417a94e554ad8242e7e3af619d67433dade8c
          git fetch --no-tags origin "$baseline_ref"
          git worktree add --detach "$RUNNER_TEMP/mqtt-reader-baseline" "$baseline_ref"
          cp native/transport/Cargo.lock "$RUNNER_TEMP/mqtt-reader-baseline/native/transport/Cargo.lock"
          CARGO_TARGET_DIR="$RUNNER_TEMP/mqtt-reader-candidate-target" \
            cargo build --manifest-path native/transport/Cargo.toml -p ct_ffi --release --features ffi-test --locked
          CARGO_TARGET_DIR="$RUNNER_TEMP/mqtt-reader-baseline-target" \
            cargo build --manifest-path "$RUNNER_TEMP/mqtt-reader-baseline/native/transport/Cargo.toml" \
            -p ct_ffi --release --features ffi-test --locked
          {
            printf 'baseline=%s\n' "$baseline_ref"
            printf 'candidate='; git rev-parse HEAD
            rustc -Vv
            dart --version
            sha256sum native/transport/Cargo.lock native/transport/ct_core/src/lib.rs \
              "$RUNNER_TEMP/mqtt-reader-baseline/native/transport/ct_core/src/lib.rs" \
              "$RUNNER_TEMP/mqtt-reader-baseline-target/release/libct_ffi.so" \
              "$RUNNER_TEMP/mqtt-reader-candidate-target/release/libct_ffi.so"
            lscpu
          } > out/mqtt-reader-linux/build-provenance.txt
      - name: Repeat every matched profile and retain failures
        if: ${{ steps.cpu.outputs.matches == 'true' }}
        env:
          ACTUAL_CPU_CLASS: ${{ steps.cpu.outputs.actual_class }}
        run: |
          set -euo pipefail
          result=0
          env -u TOKIO_WORKER_THREADS -u CONNECTANUM_NATIVE_RUNTIME_THREADS \
            bash tool/compare_mqtt_native.sh \
              "$RUNNER_TEMP/mqtt-reader-baseline-target/release/libct_ffi.so" \
              "$RUNNER_TEMP/mqtt-reader-candidate-target/release/libct_ffi.so" \
              out/mqtt-reader-linux/comparison || result=$?
          passed=false
          if [[ "$result" -eq 0 ]]; then passed=true; fi
          printf '{"requested_cpu":"%s","actual_cpu_class":"%s","matched_requested_cpu":true,"benchmark_executed":true,"candidate_passed":%s}\n' "$REQUESTED_CPU" "$ACTUAL_CPU_CLASS" "$passed" > out/mqtt-reader-linux/status.json
          exit "$result"
      - name: Preserve raw comparison and source identity
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mqtt-reader-linux-comparison
          path: out/mqtt-reader-linux
          if-no-files-found: error
