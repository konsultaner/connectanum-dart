name: MQTT gateway native cleanup qualification
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  gateway:
    uses: ./.github/workflows/mqtt-gateway-benchmarks.yml

  native-coverage:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-ci
        with:
          rust: 'true'
          native-tools: 'true'
      - name: Bootstrap workspace
        run: bin/bootstrap
      - name: Collect complete current-source Cargo coverage
        env:
          CONNECTANUM_NATIVE_COVERAGE_DIR: out/coverage-native-idle-cargo
        run: bin/test-native-coverage
      - name: Collect complete current-source Dart FFI coverage
        env:
          CONNECTANUM_NATIVE_FFI_COVERAGE_DIR: out/coverage-native-idle-ffi
        run: bin/test-native-ffi-coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mqtt-native-idle-coverage
          path: |
            out/coverage-native-idle-cargo
            out/coverage-native-idle-ffi/*.json
            out/coverage-native-idle-ffi/*.info
            out/coverage-native-idle-ffi/*.log
            out/coverage-native-idle-ffi/profiles
          if-no-files-found: error
