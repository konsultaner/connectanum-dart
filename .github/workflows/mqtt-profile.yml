name: MQTT burst Linux comparison

on:
  workflow_dispatch:
    inputs:
      target_cpu:
        description: Measure either needed CPU class or request one explicitly; always record the actual class
        type: choice
        required: true
        default: either
        options: [either, '7763', 9V74, 8370C]

concurrency:
  group: mqtt-burst-linux-${{ github.ref }}-${{ inputs.target_cpu }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  compare:
    name: MQTT bounded burst A/B probe ${{ matrix.probe }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - probe: amd-1
            runner: ubuntu-24.04
            container: ''
          - probe: amd-2
            runner: ubuntu-24.04
            container: ''
          - probe: intel
            runner: ubuntu-22.04
            container: ubuntu:24.04@sha256:78d4744ead1f5b19b04d0df558ab182a5300903900755e515b2ca4d10eb2044d
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      REQUESTED_CPU: ${{ inputs.target_cpu }}
      BENCH_OUTPUT: ${{ runner.temp }}/mqtt-burst-linux
    steps:
      - name: Require the requested hardware before timing
        id: cpu
        env:
          MQTT_CPU_INFO_PATH: /proc/cpuinfo
        run: |
          set -euo pipefail
          mkdir -p "$BENCH_OUTPUT"
          cpu_model=''
          while IFS=: read -r key value; do
            if [[ "$key" == 'model name'* ]]; then cpu_model="${value# }"; break; fi
          done < "${MQTT_CPU_INFO_PATH:-/proc/cpuinfo}"
          model_lower="$(printf '%s' "$cpu_model" | tr '[:upper:]' '[:lower:]')"
          actual_class=other
          if [[ "$model_lower" == *amd* && "$model_lower" == *7763* ]]; then actual_class=7763; fi
          if [[ "$model_lower" == *amd* && "$model_lower" == *9v74* ]]; then actual_class=9V74; fi
          if [[ "$model_lower" == *intel* && "$model_lower" == *8370c* ]]; then actual_class=8370C; fi
          matched=false
          case "$REQUESTED_CPU" in
            either) if [[ "$actual_class" != other ]]; then matched=true; fi ;;
            7763|9V74|8370C) if [[ "$actual_class" == "$REQUESTED_CPU" ]]; then matched=true; fi ;;
            *) echo 'Unsupported requested CPU class' >&2; exit 2 ;;
          esac
          printf '%s\n' "$cpu_model" > "$BENCH_OUTPUT"/cpu-model.txt
          uname -srm > "$BENCH_OUTPUT"/kernel.txt
          printf 'matches=%s\nactual_class=%s\n' "$matched" "$actual_class" >> "$GITHUB_OUTPUT"
          printf '{"requested_cpu":"%s","actual_cpu_class":"%s","matched_requested_cpu":%s,"benchmark_executed":false}\n' "$REQUESTED_CPU" "$actual_class" "$matched" > "$BENCH_OUTPUT"/status.json
          echo "Requested $REQUESTED_CPU matched: $matched ($cpu_model)"
      - name: Prepare pinned container userland
        if: ${{ steps.cpu.outputs.matches == 'true' && matrix.container != '' }}
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates curl git unzip build-essential pkg-config libssl-dev python3 procps mosquitto
      - uses: actions/checkout@v5
        if: ${{ steps.cpu.outputs.matches == 'true' }}
      - name: Trust this exact checkout
        if: ${{ steps.cpu.outputs.matches == 'true' }}
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: ./.github/actions/setup-ci
        if: ${{ steps.cpu.outputs.matches == 'true' }}
        with:
          rust: 'true'
      - name: Bootstrap and install the independent reference
        if: ${{ steps.cpu.outputs.matches == 'true' }}
        run: |
          set -euo pipefail
          if command -v sudo >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y mosquitto
          fi
          version="$(mosquitto -h 2>&1 || true)"
          [[ "$version" == *'mosquitto version 2.0.18'* ]]
          bin/bootstrap
      - name: Build the reactor baseline and bounded burst candidate
        if: ${{ steps.cpu.outputs.matches == 'true' }}
        run: |
          set -euo pipefail
          mkdir -p "$BENCH_OUTPUT"
          baseline_ref=160fc2c2f96d0a408fc96ce1ea5471f1870c04db
          git fetch --no-tags origin "$baseline_ref"
          git worktree add --detach "$RUNNER_TEMP/mqtt-burst-baseline" "$baseline_ref"
          cmp native/transport/Cargo.lock "$RUNNER_TEMP/mqtt-burst-baseline/native/transport/Cargo.lock"
          CARGO_TARGET_DIR="$RUNNER_TEMP/mqtt-burst-candidate-target" \
            cargo build --manifest-path native/transport/Cargo.toml -p ct_ffi --release --features ffi-test --locked
          CARGO_TARGET_DIR="$RUNNER_TEMP/mqtt-burst-baseline-target" \
            cargo build --manifest-path "$RUNNER_TEMP/mqtt-burst-baseline/native/transport/Cargo.toml" \
            -p ct_ffi --release --features ffi-test --locked
          {
            printf 'baseline=%s\n' "$baseline_ref"
            printf 'candidate='; git rev-parse HEAD
            rustc -Vv
            dart --version
            sha256sum native/transport/Cargo.lock native/transport/ct_core/src/lib.rs \
              "$RUNNER_TEMP/mqtt-burst-baseline/native/transport/ct_core/src/lib.rs" \
              "$RUNNER_TEMP/mqtt-burst-baseline-target/release/libct_ffi.so" \
              "$RUNNER_TEMP/mqtt-burst-candidate-target/release/libct_ffi.so"
            lscpu
          } > "$BENCH_OUTPUT"/build-provenance.txt
      - name: Repeat every matched profile and retain failures
        if: ${{ steps.cpu.outputs.matches == 'true' }}
        env:
          ACTUAL_CPU_CLASS: ${{ steps.cpu.outputs.actual_class }}
        run: |
          set -euo pipefail
          result=0
          env -u TOKIO_WORKER_THREADS -u CONNECTANUM_NATIVE_RUNTIME_THREADS \
            bash tool/compare_mqtt_native.sh \
              "$RUNNER_TEMP/mqtt-burst-baseline-target/release/libct_ffi.so" \
              "$RUNNER_TEMP/mqtt-burst-candidate-target/release/libct_ffi.so" \
              "$BENCH_OUTPUT"/comparison || result=$?
          passed=false
          if [[ "$result" -eq 0 ]]; then passed=true; fi
          printf '{"requested_cpu":"%s","actual_cpu_class":"%s","matched_requested_cpu":true,"benchmark_executed":true,"candidate_passed":%s}\n' "$REQUESTED_CPU" "$ACTUAL_CPU_CLASS" "$passed" > "$BENCH_OUTPUT"/status.json
          exit "$result"
      - name: Preserve raw comparison and source identity
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mqtt-burst-linux-comparison-${{ matrix.probe }}
          path: ${{ runner.temp }}/mqtt-burst-linux
          if-no-files-found: error
