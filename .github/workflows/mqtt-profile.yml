name: MQTT Intel 8370C acceptance availability
on:
  workflow_dispatch:

concurrency:
  group: mqtt-intel-proof-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  compare:
    name: MQTT actual 8370C probe ${{ matrix.probe }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - probe: 1
            runner: ubuntu-22.04
            container: ubuntu:24.04@sha256:78d4744ead1f5b19b04d0df558ab182a5300903900755e515b2ca4d10eb2044d
          - probe: 2
            runner: ubuntu-24.04
            container: ''
          - probe: 3
            runner: ubuntu-22.04
            container: ubuntu:24.04@sha256:78d4744ead1f5b19b04d0df558ab182a5300903900755e515b2ca4d10eb2044d
          - probe: 4
            runner: ubuntu-24.04
            container: ''
          - probe: 5
            runner: ubuntu-22.04
            container: ubuntu:24.04@sha256:78d4744ead1f5b19b04d0df558ab182a5300903900755e515b2ca4d10eb2044d
          - probe: 6
            runner: ubuntu-24.04
            container: ''
          - probe: 7
            runner: ubuntu-22.04
            container: ubuntu:24.04@sha256:78d4744ead1f5b19b04d0df558ab182a5300903900755e515b2ca4d10eb2044d
          - probe: 8
            runner: ubuntu-24.04
            container: ''
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
      REQUESTED_CPU: 8370C
      BENCH_OUTPUT: /tmp/mqtt-intel-proof-${{ github.run_id }}-${{ matrix.probe }}
      BENCH_CONTAINER: ${{ matrix.container }}
      BASELINE_ARTIFACT_DIR: /tmp/mqtt-intel-baseline-${{ github.run_id }}-${{ matrix.probe }}
    steps:
      - name: Require the requested hardware before timing
        id: cpu
        env:
          MQTT_CPU_INFO_PATH: /proc/cpuinfo
        run: |
          set -euo pipefail
          mkdir -p "$BENCH_OUTPUT"
          cpu_model=''
          while IFS=: read -r key value; do
            if [[ "$key" == 'model name'* ]]; then cpu_model="${value# }"; break; fi
          done < "${MQTT_CPU_INFO_PATH:-/proc/cpuinfo}"
          model_lower="$(printf '%s' "$cpu_model" | tr '[:upper:]' '[:lower:]')"
          actual_class=other
          if [[ "$model_lower" == *amd* && "$model_lower" == *7763* ]]; then actual_class=7763; fi
          if [[ "$model_lower" == *amd* && "$model_lower" == *9v74* ]]; then actual_class=9V74; fi
          if [[ "$model_lower" == *intel* && "$model_lower" == *8370c* ]]; then actual_class=8370C; fi
          matched=false
          case "$REQUESTED_CPU" in
            either) if [[ "$actual_class" != other ]]; then matched=true; fi ;;
            7763|9V74|8370C) if [[ "$actual_class" == "$REQUESTED_CPU" ]]; then matched=true; fi ;;
            *) echo 'Unsupported requested CPU class' >&2; exit 2 ;;
          esac
          printf '%s\n' "$cpu_model" > "$BENCH_OUTPUT"/cpu-model.txt
          uname -srm > "$BENCH_OUTPUT"/kernel.txt
          printf 'matches=%s\nactual_class=%s\n' "$matched" "$actual_class" >> "$GITHUB_OUTPUT"
          printf '{"requested_cpu":"%s","actual_cpu_class":"%s","matched_requested_cpu":%s,"benchmark_executed":false}\n' "$REQUESTED_CPU" "$actual_class" "$matched" > "$BENCH_OUTPUT"/status.json
          echo "Requested $REQUESTED_CPU matched: $matched ($cpu_model)"
      - name: Prepare pinned container userland
        if: ${{ steps.cpu.outputs.matches == 'true' && matrix.container != '' }}
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates curl git unzip build-essential pkg-config libssl-dev python3 procps mosquitto
      - uses: actions/checkout@v5
        if: ${{ steps.cpu.outputs.matches == 'true' }}
      - name: Trust this exact checkout
        if: ${{ steps.cpu.outputs.matches == 'true' }}
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: ./.github/actions/setup-ci
        if: ${{ steps.cpu.outputs.matches == 'true' }}
        with:
          rust: 'true'
      - name: Bootstrap and install the independent reference
        if: ${{ steps.cpu.outputs.matches == 'true' }}
        run: |
          set -euo pipefail
          if command -v sudo >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y mosquitto
          fi
          version="$(mosquitto -h 2>&1 || true)"
          [[ "$version" == *'mosquitto version 2.0.18'* ]]
          bin/bootstrap
      - name: Download the exact archived reactor baseline
        if: ${{ steps.cpu.outputs.matches == 'true' && matrix.container == '' }}
        uses: actions/download-artifact@v8
        with:
          name: mqtt-native-profile
          run-id: 40940745734
          github-token: ${{ github.token }}
          path: ${{ env.BASELINE_ARTIFACT_DIR }}
      - name: Prepare unchanged production source on the actual Intel CPU
        if: ${{ steps.cpu.outputs.matches == 'true' }}
        run: |
          set -euo pipefail
          mkdir -p "$BENCH_OUTPUT"
          baseline_ref=160fc2c2f96d0a408fc96ce1ea5471f1870c04db
          git fetch --no-tags origin "$baseline_ref"
          cp tool/mqtt_reference_Cargo.lock native/transport/Cargo.lock
          printf '%s  %s\n' 02f2eb85fab55294fd6316f04f27ed1fc446201dde13a0f474b137bcb26b2ab8 native/transport/Cargo.lock | sha256sum -c -
          printf '%s  %s\n' 102a43a3e1e029b2c566db74fb773450c4bb526c505fb765c7a1f526d7b92c19 native/transport/ct_core/src/lib.rs | sha256sum -c -
          if [[ -z "$BENCH_CONTAINER" ]]; then
            baseline_library="$BASELINE_ARTIFACT_DIR/ws_sustained/libct_ffi.so"
            printf '%s  %s\n' 3e97c194d2ec5ca9a1b9e20cbc002e13a80c2ca21e2231944766f54a4ac9d060 "$baseline_library" | sha256sum -c -
          else
            CARGO_TARGET_DIR="$RUNNER_TEMP/mqtt-intel-target" \
              cargo build --manifest-path native/transport/Cargo.toml -p ct_ffi --release --features ffi-test --locked
            baseline_library="$RUNNER_TEMP/mqtt-intel-target/release/libct_ffi.so"
          fi
          echo "BASELINE_LIBRARY=$baseline_library" >> "$GITHUB_ENV"
          git show "$baseline_ref":native/transport/ct_core/src/lib.rs > "$BENCH_OUTPUT/baseline-core.rs"
          {
            printf 'baseline=%s\n' "$baseline_ref"
            printf 'candidate='; git rev-parse HEAD
            rustc -Vv
            dart --version
            sha256sum native/transport/Cargo.lock native/transport/ct_core/src/lib.rs \
              "$BENCH_OUTPUT/baseline-core.rs" \
              "$baseline_library"
            lscpu
          } > "$BENCH_OUTPUT"/build-provenance.txt
      - name: Repeat every matched profile and retain failures
        if: ${{ steps.cpu.outputs.matches == 'true' }}
        env:
          ACTUAL_CPU_CLASS: ${{ steps.cpu.outputs.actual_class }}
        run: |
          set -euo pipefail
          result=0
          for pass in 1 2; do
            for profile in ws_sustained ws_v311_sustained 64k_sustained; do
              destination="$BENCH_OUTPUT/pass-$pass/$profile"
              mkdir -p "$destination"
              code=0
              env -u TOKIO_WORKER_THREADS -u CONNECTANUM_NATIVE_RUNTIME_THREADS \
                CONNECTANUM_NATIVE_LIB="$BASELINE_LIBRARY" \
                python3 tool/run_mqtt_benchmark_gate.py --native-router \
                  --budget "tool/mqtt_native_${profile}_benchmark_budget.json" \
                  --output "$destination" > "$destination/gate.log" 2>&1 || code=$?
              printf '%s\n' "$code" > "$destination/exit-code.txt"
              if [[ "$code" -ne 0 ]]; then result=1; fi
            done
          done
          passed=false
          if [[ "$result" -eq 0 ]]; then passed=true; fi
          printf '{"requested_cpu":"%s","actual_cpu_class":"%s","matched_requested_cpu":true,"benchmark_executed":true,"production_passed":%s}\n' "$REQUESTED_CPU" "$ACTUAL_CPU_CLASS" "$passed" > "$BENCH_OUTPUT"/status.json
          exit "$result"
      - name: Preserve raw comparison and source identity
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mqtt-intel-proof-comparison-${{ matrix.probe }}
          path: ${{ env.BENCH_OUTPUT }}
          if-no-files-found: error
