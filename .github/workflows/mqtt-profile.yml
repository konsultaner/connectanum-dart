name: MQTT current-source native FFI qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-coverage:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-ci
        with:
          rust: 'true'
          native-tools: 'true'
      - name: Bootstrap workspace
        run: bin/bootstrap
      - name: Collect complete current-source Dart FFI coverage
        env:
          CONNECTANUM_NATIVE_FFI_COVERAGE_DIR: out/coverage-native-idle-ffi
        run: bin/test-native-ffi-coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mqtt-native-idle-ffi-coverage
          path: |
            out/coverage-native-idle-ffi/*.json
            out/coverage-native-idle-ffi/*.info
            out/coverage-native-idle-ffi/*.log
            out/coverage-native-idle-ffi/profiles
          if-no-files-found: error
