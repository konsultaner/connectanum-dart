name: MQTT heap attribution diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  CI: true
jobs:
  native-build:
    name: Shared ffi-test Build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-ci
        with:
          rust: 'true'
      - id: rust
        run: echo "identity=$(rustc -Vv | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: native/transport/target/ffi-test
          key: ffi-test-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.identity }}-${{ hashFiles('native/transport/**', 'bin/common.sh') }}
          restore-keys: ffi-test-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.identity }}-
      - name: Build and record the same-run ffi-test library
        run: |
          set -euo pipefail
          source bin/common.sh
          build_native_ffi_test_release
          python3 tool/ci_native_artifact.py record --directory out/ci-native \
            --library "$CONNECTANUM_NATIVE_LIB"
      - uses: actions/upload-artifact@v7
        with:
          name: mqtt-gateway-native-ffi-test
          path: out/ci-native
          if-no-files-found: error

  heap-attribution:
    name: Linux default-runtime heap attribution
    needs: native-build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-ci
        with:
          rust: 'true'
      - uses: actions/download-artifact@v8
        with:
          name: mqtt-gateway-native-ffi-test
          path: out/ci-native
      - name: Attribute memory without altering the workload or collecting
        run: |
          set -euo pipefail
          python3 tool/ci_native_artifact.py prepare --directory out/ci-native
          export CONNECTANUM_NATIVE_LIB="$PWD/out/ci-native/libct_ffi.so"
          bin/bootstrap
          python3 tool/mqtt_gateway_heap_attribution.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mqtt-gateway-heap-attribution
          path: out/mqtt-heap-attribution
          if-no-files-found: error
