name: Dart 3.14 cold-cycle RSS diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  cold-cycle-rss:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.14.0
      - uses: actions/download-artifact@v8
        with:
          name: ci-gateway-native-arm64
          run-id: 44117823578
          github-token: ${{ github.token }}
          path: out/probe-native
      - name: Record host and verify unchanged native source
        run: |
          set -euo pipefail
          git diff --exit-code 4de24d255b5e7c24dbbd9a5bdfe49bf792dcb57b HEAD -- native/transport
          mkdir -p out/probe-host
          lscpu --json > out/probe-host/lscpu.json
          cat /proc/meminfo > out/probe-host/meminfo.txt
          getconf PAGESIZE > out/probe-host/page-size.txt
          cat /sys/kernel/mm/transparent_hugepage/enabled > out/probe-host/thp.txt
          sha256sum out/probe-native/libct_ffi.so > out/probe-host/native-sha256.txt
      - name: Prepare exact worker dependencies
        run: |
          set -euo pipefail
          dart pub get
          python3 -m venv "$RUNNER_TEMP/probe-python"
          "$RUNNER_TEMP/probe-python/bin/pip" install paho-mqtt==2.1.0
      - name: Build diagnostic snapshot callback
        run: |
          mkdir -p out/probe-heap
          cc -shared -fPIC -O2 tool/dart314_heap_snapshot.c -o out/probe-heap/libprobe.so
      - name: Observe unchanged normal and read-only heap workers
        env:
          CONNECTANUM_SKIP_NATIVE_BUILD: '1'
        run: |
          set -euo pipefail
          export CONNECTANUM_NATIVE_LIB="$GITHUB_WORKSPACE/out/probe-native/libct_ffi.so"
          export PAHO_PYTHON="$RUNNER_TEMP/probe-python/bin/python"
          "$PAHO_PYTHON" tool/dart314_rss_probe.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dart314-rss-probe
          path: |
            out/dart314-rss-probe
            out/probe-host
          retention-days: 7
