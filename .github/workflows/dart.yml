name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Supersede automated codex branch runs within each event/ref only. Unique
# run-id groups preserve master, tags, manual runs and other branch histories.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ (github.event_name == 'push' || github.event_name == 'pull_request') && github.ref_type == 'branch' && startsWith(github.head_ref || github.ref_name, 'codex/') && github.ref || github.run_id }}
  cancel-in-progress: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && github.ref_type == 'branch' && startsWith(github.head_ref || github.ref_name, 'codex/') }}

permissions:
  contents: read

env:
  CI: true

jobs:
  flatbuffers-binding:
    name: FlatBuffers Binding
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Fetch checksum-pinned compiler
        run: python3 tool/fetch_flatc.py --output "$RUNNER_TEMP/flatc"
      - name: Bootstrap workspace
        run: dart pub get
      - name: Verify Dart SDK socket pointer boundary
        run: |
          set -euo pipefail
          mkdir -p out/sdk-socket-pointer
          probe_output="$PWD/out/sdk-socket-pointer"
          cc -shared -fPIC -Wall -Wextra -Werror \
            -o "$RUNNER_TEMP/sdk_socket_copy_probe.so" \
            tool/sdk_socket_copy_probe.c -ldl -pthread
          cd packages/connectanum_client
          CONNECTANUM_SKIP_NATIVE_BUILD=1 \
            LD_PRELOAD="$RUNNER_TEMP/sdk_socket_copy_probe.so" \
            dart run tool/sdk_socket_copy_probe.dart | tee "$probe_output/observations.jsonl"
          CONNECTANUM_SKIP_NATIVE_BUILD=1 \
            LD_PRELOAD="$RUNNER_TEMP/sdk_socket_copy_probe.so" \
            dart run tool/rawsocket_copy_probe.dart | tee "$probe_output/rawsocket-ppt.jsonl"
          CONNECTANUM_SKIP_NATIVE_BUILD=1 \
            LD_PRELOAD="$RUNNER_TEMP/sdk_socket_copy_probe.so" \
            dart run tool/sdk_socket_backpressure_probe.dart | tee "$probe_output/backpressure.jsonl"
          CONNECTANUM_SKIP_NATIVE_BUILD=1 \
            LD_PRELOAD="$RUNNER_TEMP/sdk_socket_copy_probe.so" \
            dart --enable-vm-service=0 --disable-service-auth-codes \
              run tool/native_external_byte_view_probe.dart | tee "$probe_output/native-bounded.jsonl"
          CONNECTANUM_SKIP_NATIVE_BUILD=1 \
            dart compile aot-snapshot tool/native_external_byte_view_probe.dart \
              -o "$probe_output/native-bounded.aot"
          LD_PRELOAD="$RUNNER_TEMP/sdk_socket_copy_probe.so" \
            dartaotruntime "$probe_output/native-bounded.aot" --allocation-pressure \
              | tee "$probe_output/native-bounded-aot.jsonl"
          if env -u LD_PRELOAD CONNECTANUM_SKIP_NATIVE_BUILD=1 \
            dart run tool/sdk_socket_copy_probe.dart \
            > "$probe_output/missing-interposer.log" 2>&1; then
            echo 'Socket pointer probe incorrectly passed without its interposer' >&2
            exit 1
          fi
          python3 -c 'from pathlib import Path; import sys; sys.exit("undefined symbol: probe_reset" not in Path(sys.argv[1]).read_text())' \
            "$probe_output/missing-interposer.log"
          if env -u LD_PRELOAD CONNECTANUM_SKIP_NATIVE_BUILD=1 \
            dart --enable-vm-service=0 --disable-service-auth-codes \
              run tool/native_external_byte_view_probe.dart \
            > "$probe_output/native-bounded-missing-interposer.log" 2>&1; then
            echo 'Native bounded-view probe incorrectly passed without its interposer' >&2
            exit 1
          fi
          python3 -c 'from pathlib import Path; import sys; sys.exit("undefined symbol: probe_watch_free" not in Path(sys.argv[1]).read_text())' \
            "$probe_output/native-bounded-missing-interposer.log"
      - name: Upload SDK socket pointer evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sdk-socket-pointer
          path: out/sdk-socket-pointer
          if-no-files-found: error
      - name: Verify generated bindings and fixtures
        run: python3 tool/generate_wamp_flatbuffers.py --check --flatc "$RUNNER_TEMP/flatc/flatc"
      - name: Verify typed benchmark binding
        run: python3 tool/generate_bench_flatbuffers.py --check --flatc "$RUNNER_TEMP/flatc/flatc"
      - name: Verify independent upstream interoperability
        run: |
          python3 -m venv "$RUNNER_TEMP/flatbuffers-python"
          "$RUNNER_TEMP/flatbuffers-python/bin/python" -m pip install -r tool/flatbuffers_peer_requirements.txt
          "$RUNNER_TEMP/flatbuffers-python/bin/python" tool/check_wamp_flatbuffers_interop.py --flatc "$RUNNER_TEMP/flatc/flatc"
      - name: Build native library for independent live peer
        run: cargo build --manifest-path native/transport/Cargo.toml -p ct_ffi
      - name: Verify negotiated FlatBuffers live peer
        run: |
          "$RUNNER_TEMP/flatbuffers-python/bin/python" tool/check_wamp_flatbuffers_live_peer.py \
            --flatc "$RUNNER_TEMP/flatc/flatc" \
            --native-library native/transport/target/debug/libct_ffi.so \
            --output out/flatbuffers-live-peer
      - name: Upload live peer evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flatbuffers-live-peer
          path: out/flatbuffers-live-peer
          if-no-files-found: warn

  native-memory:
    name: Native Ownership GuardMalloc
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify memory-gate failure controls
        run: |
          set -euo pipefail
          mkdir -p out/native-memory-controls
          python3 tool/test_run_native_guardmalloc.py 2>&1 | tee out/native-memory-controls/tests.log
      - name: Run instrumented native ownership checks
        run: python3 tool/run_native_guardmalloc.py --output out/native-guardmalloc
      - name: Upload native memory evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-ownership-guardmalloc
          path: |
            out/native-guardmalloc
            out/native-memory-controls
          if-no-files-found: error

  native-build:
    name: Shared ffi-test Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-ci
        with:
          rust: 'true'
      - id: rust
        run: echo "identity=$(rustc -Vv | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: native/transport/target/ffi-test
          key: ffi-test-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.identity }}-${{ hashFiles('native/transport/**', 'bin/common.sh') }}
          restore-keys: ffi-test-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.identity }}-
      - name: Build and record the same-run ffi-test library
        run: |
          set -euo pipefail
          source bin/common.sh
          build_native_ffi_test_release
          python3 tool/ci_native_artifact.py record --directory out/ci-native \
            --library "$CONNECTANUM_NATIVE_LIB"
      - uses: actions/upload-artifact@v7
        with:
          name: ci-native-ffi-test
          path: out/ci-native
          if-no-files-found: error

  fast:
    name: Fast Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-ci
      - name: Format, analyze and verify tooling contracts
        run: bin/test-ci-fast

  wamp-app:
    name: WampApp Consumer
    runs-on: ubuntu-latest
    # Includes cold Flutter builds, VM/JS/WASM controls, and coverage collection.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - uses: dtolnay/rust-toolchain@stable

      - id: chrome
        uses: browser-actions/setup-chrome@v2

      - name: Verify standalone WampApp packages
        env:
          CHROME_EXECUTABLE: ${{ steps.chrome.outputs.chrome-path }}
        run: bin/test-wamp-app

      - name: Activate application coverage tooling
        run: dart pub global activate coverage 1.15.1

      - name: Enforce shared application protocol coverage
        env:
          CONNECTANUM_APP_SHARED_COVERAGE_DIR: out/coverage-app-shared
        run: bin/test-app-shared-coverage

      - name: Upload shared application protocol coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-shared-vm-coverage
          path: |
            out/coverage-app-shared/lcov.info
            out/coverage-app-shared/summary.json
            out/coverage-app-shared/raw
          if-no-files-found: warn

      - name: Enforce shared application JavaScript coverage
        env:
          CHROME_EXECUTABLE: ${{ steps.chrome.outputs.chrome-path }}
          CONNECTANUM_APP_SHARED_COVERAGE_RUNTIME: chrome
          CONNECTANUM_APP_SHARED_COVERAGE_DIR: out/coverage-app-shared-chrome
        run: bin/test-app-shared-coverage

      - name: Upload shared application JavaScript coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-shared-chrome-coverage
          path: |
            out/coverage-app-shared-chrome/lcov.info
            out/coverage-app-shared-chrome/summary.json
            out/coverage-app-shared-chrome/raw
          if-no-files-found: warn

  verify:
    name: Full Verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [fast, verification, wamp-app, flatbuffers-binding, native-memory, mutation-gates, mcp-mutations, browser-coverage]
    steps:
      - uses: actions/checkout@v5
      - name: Require every validation lane to succeed
        env:
          CONNECTANUM_CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 tool/check_ci_needs.py

  verification:
    name: Dart VM Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: native-build
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-ci
        with:
          rust: 'true'
          native-tools: 'true'
      # Codecov needs OIDC, but public dependency downloads do not need pub auth.
      - name: Use anonymous pub.dev downloads
        run: |
          pub_token_repositories="$(dart pub token list)"
          if grep -Fxq 'https://pub.dev' <<< "$pub_token_repositories"; then
            dart pub token remove https://pub.dev
          fi
          unset pub_token_repositories

      - uses: actions/download-artifact@v8
        with:
          name: ci-native-ffi-test
          path: out/ci-native
      - name: Validate shared native identity
        run: python3 tool/ci_native_artifact.py prepare --directory out/ci-native
      - name: Bootstrap workspace
        run: bin/bootstrap
      - name: Activate coverage tooling
        run: dart pub global activate coverage 1.15.1
      - name: Run Rust, consumers and complete VM suites with coverage
        env:
          CONNECTANUM_TEST_LLVM_COVERAGE: '1'
          CONNECTANUM_CI_VERIFY: '1'
          CONNECTANUM_CI_NATIVE_DIR: out/ci-native
          CONNECTANUM_COVERAGE_DIR: out/coverage
        run: bin/verify
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          disable_search: true
          fail_ci_if_error: true
          files: out/coverage/lcov.info
          flags: dart-vm
          name: dart-vm
          plugins: noop
          use_oidc: true
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dart-vm-coverage
          path: |
            out/coverage/lcov.info
            out/coverage/summary.json
            out/coverage/packaging-lcov.info
            out/coverage/packaging-summary.json
          if-no-files-found: error

  mutation-gates:
    name: ${{ matrix.group }} Mutation Gate
    runs-on: ubuntu-latest
    needs: native-build
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: core-contracts-vm
            timeout_minutes: 30
            chrome: false
          - group: core-contracts-web
            timeout_minutes: 60
            chrome: true
          - group: bench-config-http
            timeout_minutes: 30
            chrome: false
          - group: core-utils-vm
            timeout_minutes: 45
            chrome: false
          - group: client-utils-vm
            timeout_minutes: 45
            chrome: false
          - group: installers
            timeout_minutes: 45
            chrome: false
          - group: router-authorization
            timeout_minutes: 30
            chrome: false
          - group: core-metadata-web
            timeout_minutes: 90
            chrome: true
          - group: auth-server
            timeout_minutes: 30
            chrome: false
          - group: core-e2ee-vm
            timeout_minutes: 30
            chrome: false
          - group: core-lazy-web
            timeout_minutes: 90
            chrome: true
          - group: core-pem-pkcs8-web
            timeout_minutes: 90
            chrome: true
          - group: client-message-binding-vm
            timeout_minutes: 90
            chrome: false
          - group: router-message-binding-vm
            timeout_minutes: 90
            chrome: false
          - group: bench-remote-auth-native
            timeout_minutes: 30
            chrome: false
          - group: router-remote-wamp-vm
            timeout_minutes: 45
            chrome: false
          - group: router-config-loader-vm
            timeout_minutes: 45
            chrome: false
          - group: router-remote-authenticator-vm
            timeout_minutes: 45
            chrome: false
          - group: router-http-auth-vm
            timeout_minutes: 45
            chrome: false
          - group: client-meta-cache-web
            timeout_minutes: 45
            chrome: true
          - group: core-base64-web
            timeout_minutes: 45
            chrome: true
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-ci
        id: setup
        with:
          rust: ${{ matrix.group == 'bench-remote-auth-native' && 'true' || 'false' }}
          chrome: ${{ matrix.chrome && 'true' || 'false' }}
      - uses: actions/download-artifact@v8
        if: matrix.group == 'bench-remote-auth-native'
        with:
          name: ci-native-ffi-test
          path: out/ci-native
      - name: Prepare shared native identity and dependencies
        if: matrix.group == 'bench-remote-auth-native'
        run: python3 tool/ci_native_artifact.py prepare --directory out/ci-native
      - name: Run every target in the group with its complete inventory
        env:
          CHROME_EXECUTABLE: ${{ steps.setup.outputs.chrome-path }}
          CONNECTANUM_MUTATIONS_NATIVE: ${{ matrix.group == 'bench-remote-auth-native' && '1' || '0' }}
          CONNECTANUM_CI_NATIVE_DIR: ${{ matrix.group == 'bench-remote-auth-native' && 'out/ci-native' || '' }}
        run: python3 tool/run_ci_mutations.py --group "${{ matrix.group }}" --output out/mutations
      - name: Upload complete inventory, scores and per-mutant logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutations-${{ matrix.group }}
          path: out/mutations
          if-no-files-found: error

  mcp-shards:
    name: MCP Mutation Shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-ci
      - name: Execute the assigned complete-inventory partition
        run: bin/test-mutations --target mcp-library --shard-index "${{ matrix.shard }}" --shard-count 6 --output out/mutations
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutations-mcp-shard-${{ matrix.shard }}
          path: out/mutations
          if-no-files-found: error

  mcp-mutations:
    name: mcp-library Mutation Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: mcp-shards
    if: always()
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-ci
      - run: dart pub get
      - uses: actions/download-artifact@v8
        with:
          pattern: mutations-mcp-shard-*
          path: out/mcp-shards
      - name: Regenerate the full inventory and enforce its original assertion gate
        run: python3 tool/merge_dart_mutation_shards.py --input out/mcp-shards --output out/mcp-aggregate --target mcp-library --shard-count 6
      - name: Require all shard jobs to have succeeded
        env:
          SHARD_RESULT: ${{ needs.mcp-shards.result }}
        run: test "$SHARD_RESULT" = success
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutations-mcp-aggregate
          path: out/mcp-aggregate
          if-no-files-found: error

  browser-coverage:
    name: Core Browser Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-ci
        id: setup
        with:
          chrome: 'true'
      - run: dart pub global activate coverage 1.15.1
      - name: Measure full core browser suite and portable client suites
        env:
          CHROME_EXECUTABLE: ${{ steps.setup.outputs.chrome-path }}
          CONNECTANUM_BROWSER_COVERAGE_DIR: out/coverage-browser
        run: bin/test-browser-coverage
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: core-browser-coverage
          path: out/coverage-browser
          if-no-files-found: error
