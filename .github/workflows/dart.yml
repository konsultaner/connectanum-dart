name: Dart 3.14 cold-cycle RSS diagnostics
on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [rss, guardmalloc]
        default: rss
permissions:
  contents: read
  actions: read
jobs:
  cold-cycle-rss:
    if: ${{ inputs.target == 'rss' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.14.0
      - uses: actions/download-artifact@v8
        with:
          name: ci-gateway-native-arm64
          run-id: 44117823578
          github-token: ${{ github.token }}
          path: out/probe-native
      - name: Record host and verify unchanged native source
        run: |
          set -euo pipefail
          git diff --exit-code f3798ef45fd9bb746b55fcb2d66cc47c39299f58 HEAD -- native/transport ':(exclude)native/transport/ct_ffi/src/runtime/external_network_tests.rs'
          mkdir -p out/probe-host
          lscpu --json > out/probe-host/lscpu.json
          cat /proc/meminfo > out/probe-host/meminfo.txt
          getconf PAGESIZE > out/probe-host/page-size.txt
          cat /sys/kernel/mm/transparent_hugepage/enabled > out/probe-host/thp.txt
          sha256sum out/probe-native/libct_ffi.so > out/probe-host/native-sha256.txt
      - name: Prepare exact worker dependencies
        run: |
          set -euo pipefail
          dart pub get
          python3 -m venv "$RUNNER_TEMP/probe-python"
          "$RUNNER_TEMP/probe-python/bin/pip" install paho-mqtt==2.1.0
      - name: Build diagnostic snapshot callback
        run: |
          mkdir -p out/probe-heap
          cc -shared -fPIC -O2 tool/dart314_heap_snapshot.c -o out/probe-heap/libprobe.so
      - name: Compare unchanged default-runtime overload workload
        env:
          CONNECTANUM_SKIP_NATIVE_BUILD: '1'
        run: |
          set -euo pipefail
          export CONNECTANUM_NATIVE_LIB="$GITHUB_WORKSPACE/out/probe-native/libct_ffi.so"
          export PAHO_PYTHON="$RUNNER_TEMP/probe-python/bin/python"
          "$PAHO_PYTHON" tool/dart314_rss_probe.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dart314-rss-probe
          path: |
            out/dart314-rss-probe
            out/probe-host
          retention-days: 7

  guardmalloc-ordering:
    if: ${{ inputs.target == 'guardmalloc' }}
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify unchanged production and guard controls
        run: |
          git diff --exit-code f3798ef45fd9bb746b55fcb2d66cc47c39299f58 HEAD -- native/transport ':(exclude)native/transport/ct_ffi/src/runtime/external_network_tests.rs' tool/run_native_guardmalloc.py
          python3 tool/test_run_native_guardmalloc.py
      - name: Repeat exact guarded native inventory
        run: |
          set -euo pipefail
          mkdir -p out/guardmalloc-probe/controls
          shasum -a 256 tool/test_run_native_guardmalloc.py > out/guardmalloc-probe/controls/source-sha256.txt
          for index in 1 2 3 4 5; do
            python3 tool/test_run_native_guardmalloc.py 2>&1 | tee "out/guardmalloc-probe/controls/${index}.log"
            python3 tool/run_native_guardmalloc.py --output "out/guardmalloc-probe/${index}"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dart314-guardmalloc-ordering
          path: out/guardmalloc-probe
          if-no-files-found: error
          retention-days: 7
