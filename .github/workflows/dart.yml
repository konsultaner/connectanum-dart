name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: true

jobs:
  fast:
    name: Fast Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: dart-lang/setup-dart@v1

      - uses: dtolnay/rust-toolchain@stable

      - id: chrome
        uses: browser-actions/setup-chrome@v2

      - name: Bootstrap workspace
        env:
          CHROME_EXECUTABLE: ${{ steps.chrome.outputs.chrome-path }}
        run: bin/bootstrap

      - name: Run fast regression set
        env:
          CHROME_EXECUTABLE: ${{ steps.chrome.outputs.chrome-path }}
        run: bin/test-fast

  wamp-app:
    name: WampApp Consumer
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - uses: dtolnay/rust-toolchain@stable

      - id: chrome
        uses: browser-actions/setup-chrome@v2

      - name: Verify standalone WampApp packages
        env:
          CHROME_EXECUTABLE: ${{ steps.chrome.outputs.chrome-path }}
        run: bin/test-wamp-app

  verify:
    name: Full Verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [fast, wamp-app]

    steps:
      - uses: actions/checkout@v5

      - uses: dart-lang/setup-dart@v1

      - uses: dtolnay/rust-toolchain@stable

      - id: chrome
        uses: browser-actions/setup-chrome@v2

      - name: Bootstrap workspace
        env:
          CHROME_EXECUTABLE: ${{ steps.chrome.outputs.chrome-path }}
        run: bin/bootstrap

      - name: Run full verification
        env:
          CHROME_EXECUTABLE: ${{ steps.chrome.outputs.chrome-path }}
        run: bin/verify

  coverage:
    name: Dart VM Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [fast, wamp-app]
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - uses: dart-lang/setup-dart@v1

      # Codecov needs OIDC, but public dependency downloads do not need pub auth.
      - name: Use anonymous pub.dev downloads
        run: |
          if dart pub token list | grep -Fxq 'https://pub.dev'; then
            dart pub token remove https://pub.dev
          fi

      - uses: dtolnay/rust-toolchain@stable

      - name: Bootstrap workspace
        run: bin/bootstrap

      - name: Activate coverage tooling
        run: dart pub global activate coverage 1.15.1

      - name: Collect Dart VM coverage
        env:
          CONNECTANUM_COVERAGE_DIR: out/coverage
        run: bin/test-coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          disable_search: true
          fail_ci_if_error: true
          files: out/coverage/lcov.info
          flags: dart-vm
          name: dart-vm
          plugins: noop
          use_oidc: true

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dart-vm-coverage
          path: |
            out/coverage/lcov.info
            out/coverage/summary.json
          if-no-files-found: error

  mutation-gates:
    name: ${{ matrix.target }} Mutation Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [router-authorization, auth-server]
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
      - name: Run the complete target AST mutation inventory
        run: bin/test-mutations --target "${{ matrix.target }}" --output out/mutations
      - name: Upload complete inventory, scores and per-mutant logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutations-${{ matrix.target }}
          path: out/mutations
          if-no-files-found: error

  browser-coverage:
    name: Core Browser Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
      - id: chrome
        uses: browser-actions/setup-chrome@v2
      - run: dart pub global activate coverage 1.15.1
      - name: Measure browser serializers and SCRAM Worker
        env:
          CHROME_EXECUTABLE: ${{ steps.chrome.outputs.chrome-path }}
          CONNECTANUM_BROWSER_COVERAGE_DIR: out/coverage-browser
        run: bin/test-browser-coverage
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: core-browser-coverage
          path: |
            out/coverage-browser/lcov.info
            out/coverage-browser/summary.json
          if-no-files-found: error
