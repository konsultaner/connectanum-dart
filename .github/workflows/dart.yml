name: Dart 3.14 cold-cycle RSS diagnostics
on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [rss]
        default: rss
permissions:
  contents: read
  actions: read
jobs:
  cold-cycle-rss:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.14.0
      - uses: actions/download-artifact@v8
        with:
          name: ci-gateway-native-arm64
          run-id: 44278824458
          github-token: ${{ github.token }}
          path: out/probe-native
      - name: Verify unchanged source and record profiler
        run: |
          set -euo pipefail
          git diff --exit-code 2bd89a33 HEAD -- native/transport packages/connectanum_router/lib packages/connectanum_core/lib packages/connectanum_router/test/support/mqtt_frame_gc_probe.dart
          mkdir -p out/probe-host
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends heaptrack
          dpkg-query -W heaptrack > out/probe-host/heaptrack-version.txt
          dpkg-query -L heaptrack > out/probe-host/heaptrack-files.txt
          sha256sum out/probe-native/libct_ffi.so > out/probe-host/native-sha256.txt
      - name: Prepare exact worker dependencies
        run: |
          set -euo pipefail
          dart pub get
          python3 -m venv "$RUNNER_TEMP/probe-python"
          "$RUNNER_TEMP/probe-python/bin/pip" install paho-mqtt==2.1.0
      - name: Attribute unchanged broker allocations
        env:
          CONNECTANUM_SKIP_NATIVE_BUILD: '1'
        run: |
          set -euo pipefail
          export CONNECTANUM_NATIVE_LIB="$GITHUB_WORKSPACE/out/probe-native/libct_ffi.so"
          export PAHO_PYTHON="$RUNNER_TEMP/probe-python/bin/python"
          export HEAPTRACK_PRELOAD="$(dpkg-query -L heaptrack | rg '/libheaptrack_preload.so$')"
          export HEAPTRACK_INTERPRET="$(dpkg-query -L heaptrack | rg '/heaptrack_interpret$')"
          test -f "$HEAPTRACK_PRELOAD"
          test -x "$HEAPTRACK_INTERPRET"
          "$PAHO_PYTHON" tool/dart314_rss_probe.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dart314-rss-probe
          path: |
            out/dart314-rss-probe
            out/probe-host
          retention-days: 7
