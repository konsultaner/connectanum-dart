name: Dart 3.14 cold-cycle RSS diagnostics
on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [rss]
        default: rss
permissions:
  contents: read
  actions: read
jobs:
  cold-cycle-rss:
    if: ${{ inputs.target == 'rss' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.14.0
      - uses: actions/download-artifact@v8
        with:
          name: dart314-rss-probe
          run-id: 44307443109
          github-token: ${{ github.token }}
          path: out/probe-baseline
      - uses: dtolnay/rust-toolchain@stable
      - name: Record host and verify unchanged core native source
        run: |
          set -euo pipefail
          git diff --exit-code 2bd89a33d14c0980d808ecbb4b0ded46e2c3bd8f HEAD -- native/transport ':(exclude)native/transport/ct_ffi/Cargo.toml' ':(exclude)native/transport/ct_ffi/src/runtime/mod.rs' ':(exclude)native/transport/ct_ffi/src/runtime/mapped_bytes.rs'
          mkdir -p out/probe-host
          lscpu --json > out/probe-host/lscpu.json
          cat /proc/meminfo > out/probe-host/meminfo.txt
          getconf PAGESIZE > out/probe-host/page-size.txt
          cat /sys/kernel/mm/transparent_hugepage/enabled > out/probe-host/thp.txt
          sha256sum out/probe-baseline/probe-candidate/libct_ffi.so > out/probe-host/native-sha256.txt
      - name: Prepare exact worker dependencies
        run: |
          set -euo pipefail
          dart pub get
          python3 -m venv "$RUNNER_TEMP/probe-python"
          "$RUNNER_TEMP/probe-python/bin/pip" install paho-mqtt==2.1.0
      - name: Build portable native allocator
        run: |
          set -euo pipefail
          source bin/common.sh
          build_native_ffi_test_release
          mkdir -p out/probe-candidate
          cp "$CONNECTANUM_NATIVE_LIB" out/probe-candidate/libct_ffi.so
          sha256sum out/probe-candidate/libct_ffi.so > out/probe-candidate/native-sha256.txt
          export CONNECTANUM_NATIVE_LIB="$GITHUB_WORKSPACE/out/probe-candidate/libct_ffi.so"
          (cd packages/connectanum_router; dart test test/native/mqtt_frame_buffer_test.dart test/mqtt/mqtt_native_router_integration_test.dart --name "immutable snapshot owns|legacy libraries|fresh native library|payload views survive actual GC" --reporter expanded) 2>&1 | tee out/probe-candidate/ownership-tests.log
      - name: Compare unchanged default-runtime overload workload
        env:
          CONNECTANUM_SKIP_NATIVE_BUILD: '1'
        run: |
          set -euo pipefail
          export CONNECTANUM_NATIVE_LIB="$GITHUB_WORKSPACE/out/probe-baseline/probe-candidate/libct_ffi.so"
          export PAHO_PYTHON="$RUNNER_TEMP/probe-python/bin/python"
          export RSS_PROBE_CANDIDATE_LIB="$GITHUB_WORKSPACE/out/probe-candidate/libct_ffi.so"
          "$PAHO_PYTHON" tool/dart314_rss_probe.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dart314-rss-probe
          path: |
            out/dart314-rss-probe
            out/probe-host
            out/probe-candidate
          retention-days: 7
