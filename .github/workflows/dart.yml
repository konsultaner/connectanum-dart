name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: true

jobs:
  flatbuffers-binding:
    name: FlatBuffers Binding
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Fetch checksum-pinned compiler
        run: python3 tool/fetch_flatc.py --output "$RUNNER_TEMP/flatc"
      - name: Bootstrap workspace
        run: dart pub get
      - name: Verify generated bindings and fixtures
        run: python3 tool/generate_wamp_flatbuffers.py --check --flatc "$RUNNER_TEMP/flatc/flatc"
      - name: Verify typed benchmark binding
        run: python3 tool/generate_bench_flatbuffers.py --check --flatc "$RUNNER_TEMP/flatc/flatc"
      - name: Verify independent upstream interoperability
        run: |
          python3 -m venv "$RUNNER_TEMP/flatbuffers-python"
          "$RUNNER_TEMP/flatbuffers-python/bin/python" -m pip install -r tool/flatbuffers_peer_requirements.txt
          "$RUNNER_TEMP/flatbuffers-python/bin/python" tool/check_wamp_flatbuffers_interop.py --flatc "$RUNNER_TEMP/flatc/flatc"
      - name: Build native library for independent live peer
        run: cargo build --manifest-path native/transport/Cargo.toml -p ct_ffi
      - name: Verify negotiated FlatBuffers live peer
        run: |
          "$RUNNER_TEMP/flatbuffers-python/bin/python" tool/check_wamp_flatbuffers_live_peer.py \
            --flatc "$RUNNER_TEMP/flatc/flatc" \
            --native-library native/transport/target/debug/libct_ffi.so \
            --output out/flatbuffers-live-peer
      - name: Upload live peer evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flatbuffers-live-peer
          path: out/flatbuffers-live-peer
          if-no-files-found: warn

  native-memory:
    name: Native Ownership GuardMalloc
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify memory-gate failure controls
        run: |
          set -euo pipefail
          mkdir -p out/native-memory-controls
          python3 tool/test_run_native_guardmalloc.py 2>&1 | tee out/native-memory-controls/tests.log
      - name: Run instrumented native ownership checks
        run: python3 tool/run_native_guardmalloc.py --output out/native-guardmalloc
      - name: Upload native memory evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-ownership-guardmalloc
          path: |
            out/native-guardmalloc
            out/native-memory-controls
          if-no-files-found: error

  fast:
    name: Fast Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: dart-lang/setup-dart@v1

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Install native coverage tooling
        run: cargo install cargo-llvm-cov --locked --version 0.9.1

      - name: Install native mutation tooling
        run: cargo install cargo-mutants --locked --version 27.1.0

      - id: chrome
        uses: browser-actions/setup-chrome@v2

      - name: Bootstrap workspace
        env:
          CHROME_EXECUTABLE: ${{ steps.chrome.outputs.chrome-path }}
        run: bin/bootstrap

      - name: Run fast regression set
        env:
          CHROME_EXECUTABLE: ${{ steps.chrome.outputs.chrome-path }}
          CONNECTANUM_TEST_LLVM_COVERAGE: '1'
        run: bin/test-fast

  wamp-app:
    name: WampApp Consumer
    runs-on: ubuntu-latest
    # Includes cold Flutter builds, VM/JS/WASM controls, and coverage collection.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - uses: dtolnay/rust-toolchain@stable

      - id: chrome
        uses: browser-actions/setup-chrome@v2

      - name: Verify standalone WampApp packages
        env:
          CHROME_EXECUTABLE: ${{ steps.chrome.outputs.chrome-path }}
        run: bin/test-wamp-app

      - name: Activate application coverage tooling
        run: dart pub global activate coverage 1.15.1

      - name: Enforce shared application protocol coverage
        env:
          CONNECTANUM_APP_SHARED_COVERAGE_DIR: out/coverage-app-shared
        run: bin/test-app-shared-coverage

      - name: Upload shared application protocol coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-shared-vm-coverage
          path: |
            out/coverage-app-shared/lcov.info
            out/coverage-app-shared/summary.json
            out/coverage-app-shared/raw
          if-no-files-found: warn

      - name: Enforce shared application JavaScript coverage
        env:
          CHROME_EXECUTABLE: ${{ steps.chrome.outputs.chrome-path }}
          CONNECTANUM_APP_SHARED_COVERAGE_RUNTIME: chrome
          CONNECTANUM_APP_SHARED_COVERAGE_DIR: out/coverage-app-shared-chrome
        run: bin/test-app-shared-coverage

      - name: Upload shared application JavaScript coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-shared-chrome-coverage
          path: |
            out/coverage-app-shared-chrome/lcov.info
            out/coverage-app-shared-chrome/summary.json
            out/coverage-app-shared-chrome/raw
          if-no-files-found: warn

  verify:
    name: Full Verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [fast, wamp-app, flatbuffers-binding, native-memory]

    steps:
      - uses: actions/checkout@v5

      - uses: dart-lang/setup-dart@v1

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Install native coverage tooling
        run: cargo install cargo-llvm-cov --locked --version 0.9.1

      - name: Install native mutation tooling
        run: cargo install cargo-mutants --locked --version 27.1.0

      - id: chrome
        uses: browser-actions/setup-chrome@v2

      - name: Bootstrap workspace
        env:
          CHROME_EXECUTABLE: ${{ steps.chrome.outputs.chrome-path }}
        run: bin/bootstrap

      - name: Run full verification
        env:
          CHROME_EXECUTABLE: ${{ steps.chrome.outputs.chrome-path }}
          CONNECTANUM_TEST_LLVM_COVERAGE: '1'
        run: bin/verify

  coverage:
    name: Dart VM Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [fast, wamp-app]
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - uses: dart-lang/setup-dart@v1

      # Codecov needs OIDC, but public dependency downloads do not need pub auth.
      - name: Use anonymous pub.dev downloads
        run: |
          pub_token_repositories="$(dart pub token list)"
          if grep -Fxq 'https://pub.dev' <<< "$pub_token_repositories"; then
            dart pub token remove https://pub.dev
          fi
          unset pub_token_repositories

      - uses: dtolnay/rust-toolchain@stable

      - name: Bootstrap workspace
        run: bin/bootstrap

      - name: Activate coverage tooling
        run: dart pub global activate coverage 1.15.1

      - name: Collect Dart VM coverage
        env:
          CONNECTANUM_COVERAGE_DIR: out/coverage
        run: bin/test-coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          disable_search: true
          fail_ci_if_error: true
          files: out/coverage/lcov.info
          flags: dart-vm
          name: dart-vm
          plugins: noop
          use_oidc: true

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dart-vm-coverage
          path: |
            out/coverage/lcov.info
            out/coverage/summary.json
            out/coverage/packaging-lcov.info
            out/coverage/packaging-summary.json
          if-no-files-found: error

  mutation-gates:
    name: ${{ matrix.target }} Mutation Gate
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout_minutes || 20 }}
    strategy:
      fail-fast: false
      matrix:
        target: [router-authorization, router-metrics-vm, core-mcp-completion-vm, core-mcp-completion-web, core-registered-vm, core-registered-web, core-subscribed-vm, core-subscribed-web, core-metadata-vm, core-metadata-web, auth-server, client-installer, router-installer, core-e2ee-vm, bench-config, bench-http-auth-vm, core-lazy-vm, core-lazy-web, core-pem-pkcs8-vm, core-pem-pkcs8-web, client-message-binding-vm, router-message-binding-vm, bench-remote-auth-native, mcp-library, router-remote-wamp-vm, router-config-loader-vm, router-remote-authenticator-vm, router-http-auth-vm, core-scram-request-vm, core-scram-request-web, client-meta-cache-vm, client-meta-cache-web, core-base64-vm, core-base64-web]
        include:
          # MCP processed 999/1101 mutants before the 180-minute job deadline.
          # Complete campaigns must also finish the restored baseline.
          # These are job budgets; per-mutant deadlines and thresholds stay fixed.
          - target: mcp-library
            timeout_minutes: 240
          - target: router-remote-wamp-vm
            timeout_minutes: 45
          - target: router-config-loader-vm
            timeout_minutes: 45
          - target: router-remote-authenticator-vm
            timeout_minutes: 45
          - target: router-http-auth-vm
            timeout_minutes: 45
          - target: core-lazy-web
            timeout_minutes: 90
          - target: core-metadata-web
            timeout_minutes: 90
          - target: core-pem-pkcs8-web
            timeout_minutes: 90
          - target: core-base64-web
            timeout_minutes: 45
          - target: client-meta-cache-web
            timeout_minutes: 45
          - target: client-message-binding-vm
            timeout_minutes: 90
          - target: router-message-binding-vm
            timeout_minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.target == 'bench-remote-auth-native'
      - id: chrome
        if: matrix.target == 'core-lazy-web' || matrix.target == 'core-mcp-completion-web' || matrix.target == 'core-registered-web' || matrix.target == 'core-subscribed-web' || matrix.target == 'core-metadata-web' || matrix.target == 'core-pem-pkcs8-web' || matrix.target == 'core-scram-request-web' || matrix.target == 'client-meta-cache-web' || matrix.target == 'core-base64-web'
        uses: browser-actions/setup-chrome@v2
      - name: Run the complete target AST mutation inventory
        env:
          CHROME_EXECUTABLE: ${{ steps.chrome.outputs.chrome-path }}
          CONNECTANUM_MUTATIONS_NATIVE: ${{ matrix.target == 'bench-remote-auth-native' && '1' || '0' }}
        run: bin/test-mutations --target "${{ matrix.target }}" --output out/mutations
      - name: Upload complete inventory, scores and per-mutant logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutations-${{ matrix.target }}
          path: out/mutations
          if-no-files-found: error

  browser-coverage:
    name: Core Browser Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
      - id: chrome
        uses: browser-actions/setup-chrome@v2
      - run: dart pub global activate coverage 1.15.1
      - name: Measure full core browser suite and portable client suites
        env:
          CHROME_EXECUTABLE: ${{ steps.chrome.outputs.chrome-path }}
          CONNECTANUM_BROWSER_COVERAGE_DIR: out/coverage-browser
        run: bin/test-browser-coverage
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: core-browser-coverage
          path: out/coverage-browser
          if-no-files-found: error
