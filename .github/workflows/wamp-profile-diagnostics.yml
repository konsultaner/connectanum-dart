name: WAMP Native WebSocket Matched Investigation (unqualified)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: true

jobs:
  matched-websocket:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.14.0
      - uses: dtolnay/rust-toolchain@stable
      - name: Bootstrap workspace
        run: bin/bootstrap
      - name: Build original native executables
        shell: bash
        run: |
          set -euo pipefail
          source bin/common.sh
          build_native_ffi_test_release
          cargo build --release --manifest-path native/bench/Cargo.toml --bin http_stream
          mkdir -p out/native-ws-matched
          lscpu > out/native-ws-matched/hardware.txt
      - name: Alternate baseline and candidate on six unchanged file profiles
        run: python3 tool/wamp_native_ws_matched_investigation.py
      - name: Run all eight original diagnostic scenarios and gates
        run: bin/wamp-profile-diagnostics --out-dir out/wamp-profile-diagnostics
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-ws-matched-and-diagnostics
          path: |
            out/native-ws-matched
            out/wamp-profile-diagnostics
          if-no-files-found: error
