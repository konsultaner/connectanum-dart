name: WAMP Linux File Investigation (unqualified)

on:
  push:
    branches:
      - add-router
      - master
    paths:
      - .github/workflows/wamp-profile-diagnostics.yml
      - bin/wamp-profile-diagnostics
      - bin/check-bench-artifacts
      - native/bench/scenarios/wamp_client_impl_throughput.toml
      - native/bench/scenarios/wamp_payload_mode_throughput.toml
      - native/bench/scenarios/wamp_mixed_serializer_throughput.toml
      - native/bench/scenarios/wamp_websocket_fragmentation_throughput.toml
      - native/bench/scenarios/wamp_file_transfer_throughput.toml
      - native/bench/scenarios/wamp_large_rawsocket_frames_throughput.toml
      - native/bench/scenarios/wamp_file_transfer_heavy.toml
      - native/bench/scenarios/wamp_large_rawsocket_frames_heavy.toml
      - native/bench/artifact_gate/wamp_file_transfer_heavy.json
      - native/bench/artifact_gate/wamp_large_rawsocket_frames_heavy.json
  workflow_dispatch:
    inputs:
      router_worker_counts:
        description: Router worker counts passed to the bench orchestrator
        required: false
        default: "1"
        type: string
      native_runtime_thread_counts:
        description: Tokio runtime thread counts passed to the bench orchestrator
        required: false
        default: "1"
        type: string
      workload_timeout_ms:
        description: Per-workload timeout in milliseconds
        required: false
        default: "300000"
        type: string

permissions:
  contents: read

env:
  CI: true

jobs:
  linux-wamp-profile-diagnostics:
    name: Linux WAMP profile diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.14.0

      - uses: dtolnay/rust-toolchain@stable

      - name: Bootstrap workspace
        run: bin/bootstrap

      - name: Compare the original file workloads on the same runner
        run: |
          set -euo pipefail
          python3 - <<'PY_CHECK'
          import json, subprocess
          for path in json.load(open('tool/borrowed_base64_trial_files.json')):
              subprocess.run(['git', 'cat-file', '-e', '5ec2288e416b6fdd98842e841addb9d0bb35c269:' + path], check=True)
          PY_CHECK
          source bin/common.sh
          build_native_ffi_test_release
          cargo build --release --manifest-path native/bench/Cargo.toml --bin http_stream
          mkdir -p out/wamp-profile-diagnostics
          lscpu > out/wamp-profile-diagnostics/hardware.txt
          dpkg-query -W libc6 > out/wamp-profile-diagnostics/libc-version.txt
          sha256sum /usr/lib/x86_64-linux-gnu/libc.so.6 > out/wamp-profile-diagnostics/libc-sha256.txt
          cp /usr/lib/x86_64-linux-gnu/libc.so.6 out/wamp-profile-diagnostics/libc.so.6
          objdump -d --start-address=0x1a32c0 --stop-address=0x1a3420 /usr/lib/x86_64-linux-gnu/libc.so.6 > out/wamp-profile-diagnostics/libc-hot-code.txt
          python3 -u tool/wamp_file_borrowed_base64_trial.py | tee out/wamp-profile-diagnostics/comparison.log

      - name: Summarize WAMP profile diagnostics
        if: always()
        run: |
          summary=out/wamp-profile-diagnostics/diagnostics-summary.tsv
          {
            printf '## WAMP Profile Diagnostics\n\n'
            if [[ -f "$summary" ]]; then
              printf '```text\n'
              cat "$summary"
              printf '```\n\nFull results and CPU/toolchain details are in the diagnostic artifact.\n'
            else
              printf 'Diagnostics did not reach scenario execution. Inspect the setup/build logs.\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload WAMP profile diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wamp-profile-diagnostic-artifacts
          path: out/wamp-profile-diagnostics
          if-no-files-found: error
