name: WAMP Linux File Investigation (unqualified)

on:
  push:
    branches:
      - add-router
      - master
    paths:
      - .github/workflows/wamp-profile-diagnostics.yml
      - bin/wamp-profile-diagnostics
      - bin/check-bench-artifacts
      - native/bench/scenarios/wamp_client_impl_throughput.toml
      - native/bench/scenarios/wamp_payload_mode_throughput.toml
      - native/bench/scenarios/wamp_mixed_serializer_throughput.toml
      - native/bench/scenarios/wamp_websocket_fragmentation_throughput.toml
      - native/bench/scenarios/wamp_file_transfer_throughput.toml
      - native/bench/scenarios/wamp_large_rawsocket_frames_throughput.toml
      - native/bench/scenarios/wamp_file_transfer_heavy.toml
      - native/bench/scenarios/wamp_large_rawsocket_frames_heavy.toml
      - native/bench/artifact_gate/wamp_file_transfer_heavy.json
      - native/bench/artifact_gate/wamp_large_rawsocket_frames_heavy.json
  workflow_dispatch:
    inputs:
      router_worker_counts:
        description: Router worker counts passed to the bench orchestrator
        required: false
        default: "1"
        type: string
      native_runtime_thread_counts:
        description: Tokio runtime thread counts passed to the bench orchestrator
        required: false
        default: "1"
        type: string
      workload_timeout_ms:
        description: Per-workload timeout in milliseconds
        required: false
        default: "300000"
        type: string

permissions:
  contents: read

env:
  CI: true

jobs:
  linux-wamp-profile-diagnostics:
    name: Linux WAMP profile diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.14.0

      - uses: dtolnay/rust-toolchain@stable

      - name: Bootstrap workspace
        run: bin/bootstrap

      - name: Install Linux sampling tools
        run: |
          sudo apt-get update
          sudo apt-get install -y linux-tools-generic
          sudo sysctl -w kernel.perf_event_paranoid=-1
          sudo sysctl -w kernel.kptr_restrict=0

      - name: Profile original file workloads (unqualified investigation)
        run: |
          set -euo pipefail
          source bin/common.sh
          build_native_ffi_test_release
          cargo build --release --locked --manifest-path native/bench/Cargo.toml --bin http_stream
          profile_root="$PWD/out/wamp-profile-diagnostics"
          mkdir -p "$profile_root/cpu"
          export CONNECTANUM_PROFILE_OUT="$profile_root/cpu"
          lscpu > "$profile_root/hardware.txt"
          git rev-parse HEAD > "$profile_root/head.txt"
          sha256sum "$CONNECTANUM_NATIVE_LIB" packages/connectanum_client/lib/src/transport/native/runtime.dart packages/connectanum_bench/lib/src/dart_vm_metrics.dart native/bench/scenarios/wamp_file_transfer_throughput.toml > "$profile_root/inputs.sha256"
          nm -D "$CONNECTANUM_NATIVE_LIB" | rg 'ct_base64_decode' > "$profile_root/base64-exports.txt"
          perf_tool="$(rg --files --hidden --no-ignore /usr/lib/linux-tools | rg '/perf$' | sort | tail -1)"
          test -x "$perf_tool"
          for mode in source aot; do
            mkdir -p "$profile_root/$mode"
            profile_args=()
            if [[ "$mode" == source ]]; then
              profile_args+=(--skip-wamp-worker-aot --collect-wamp-vm-metrics)
            fi
            "$perf_tool" record -F 199 -g --call-graph dwarf,8192 -o "$profile_root/$mode/perf.data" --               native/bench/target/release/http_stream               --native-lib "$CONNECTANUM_NATIVE_LIB"               --scenario native/bench/scenarios/wamp_file_transfer_throughput.toml               --results "$profile_root/$mode/results.jsonl"               --artifact-dir "$profile_root/$mode"               --router-worker-counts 1 --native-runtime-thread-counts 1               --workload-timeout-ms 300000 "${profile_args[@]}"               > "$profile_root/$mode/console.log" 2>&1
            "$perf_tool" report --stdio --sort symbol,dso --percent-limit 0.2               -i "$profile_root/$mode/perf.data" > "$profile_root/$mode/perf-report.txt"
          done

      - name: Summarize WAMP profile diagnostics
        if: always()
        run: |
          summary=out/wamp-profile-diagnostics/diagnostics-summary.tsv
          {
            printf '## WAMP Profile Diagnostics\n\n'
            if [[ -f "$summary" ]]; then
              printf '```text\n'
              cat "$summary"
              printf '```\n\nFull results and CPU/toolchain details are in the diagnostic artifact.\n'
            else
              printf 'Diagnostics did not reach scenario execution. Inspect the setup/build logs.\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload WAMP profile diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wamp-profile-diagnostic-artifacts
          path: out/wamp-profile-diagnostics
          if-no-files-found: error
