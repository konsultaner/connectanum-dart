                return None
            bits = header[4]
            endian = {1: "<", 2: ">"}.get(header[5])
            if bits != 2 or endian is None:
                return None
            machine = struct.unpack_from(endian + "H", header, 18)[0]
            phoff = struct.unpack_from(endian + "Q", header, 32)[0]
            phsize, phnum = struct.unpack_from(endian + "HH", header, 54)
            if phnum and (phsize < 56 or phoff + phsize * phnum > file_bytes):
                raise RuntimeError("ELF program table exceeds the verified saved stream")
            interpreter = None
            for i in range(phnum):
                entry = read_at(phoff + i * phsize, 56)
                typ, flags, offset, va, pa, size, memsize, align = struct.unpack(endian + "IIQQQQQQ", entry)
                if typ == 3:
                    interpreter = read_at(offset, size).rstrip(b"\0").decode("utf-8")
            return {"class_byte": bits, "endianness_byte": header[5],
                    "machine_field": machine, "interpreter_field": interpreter,
                    "qualification": "Static image fields, not actual exec/mappings or full target ABI"}
  
        def preserve(label, source):
            source = Path(source)
            target = out / "inputs" / label
            src_fd = os.open(source, os.O_RDONLY)
            # Register returned handles in strong local state before reading.
            owned = {"source_fd": src_fd, "source": str(source), "destination": str(target)}
            dst_fd = None
            try:
                event({"operation": "input_open_returned_before_read", **owned})
                before = os.fstat(src_fd)
                dst_fd = os.open(target, os.O_RDWR | os.O_CREAT | os.O_EXCL, 0o644)
                owned["destination_fd"] = dst_fd
                event({"operation": "output_open_returned_before_write", **owned})
                h = hashlib.sha256()
                count = 0
                while True:
                    data = os.read(src_fd, 1024 * 1024)
                    if not data:
                        break
                    h.update(data)
                    count += len(data)
                    cursor = 0
                    while cursor < len(data):
                        written = os.write(dst_fd, data[cursor:])
                        if written <= 0:
                            raise RuntimeError("Unknown/zero write; no resend recovery")
                        event({"operation": "known_write_return", "source_offset": count - len(data) + cursor, "returned_bytes": written, "requested_bytes": len(data) - cursor})
                        cursor += written
                os.lseek(dst_fd, 0, os.SEEK_SET)
                copied_hash = hashlib.sha256()
                copied_count = 0
                while True:
                    copied = os.read(dst_fd, 1024 * 1024)
