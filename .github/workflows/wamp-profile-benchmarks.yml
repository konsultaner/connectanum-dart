                "workflow_revision": os.environ["GITHUB_SHA"],
                "run_id": os.environ["GITHUB_RUN_ID"],
                "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                "independent_reference_origin": "Previously captured original-PATH wrapper source only; no wrapper reread or bypass",
                "uid": os.getuid(), "gid": os.getgid(), "cwd": str(root),
