                resolved_path_observation = str(source.resolve(strict=True))
                row = preserve("reference-" + str(len(images)) + ".image", source)
                row["source_references"] = [request]
                row["path_observations"] = {
                    "lstat_before_open": list(path_stat),
                    "symlink_text_observed": link_text,
                    "resolved_path_observed": resolved_path_observation,
                    "qualification": "Separate point observations, not atomic path/FD/origin identity",
                }
                images[str(source)] = row
                elf = row["elf_header"]
