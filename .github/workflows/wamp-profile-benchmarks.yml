                    "RUSTFLAGS", "CARGO_ENCODED_RUSTFLAGS", "CARGO_BUILD_TARGET",
                    "ImageOS", "ImageVersion", "RUNNER_OS", "RUNNER_ARCH"]},
                "help_stdout_bytes": len(help_raw),
                "help_stdout_sha256": hashlib.sha256(help_raw).hexdigest(),
                "help_utf8_decode_error": help_decode_error,
                "print_paragraph_count": len(paragraphs),
                "actual_print_help_paragraph": observed_print_section,
                "observations": observations,
                "qualification": [
                    "Actual help is only an operational guard for already-declared information queries, never tool/image/ABI/cohort/actor/physicalEX authority",
                    "Host-tuple reports compiler host, not necessarily Cargo selected target; default cfg does not prove Cargo flags or the captured conditional ARM configuration match/inactivity",
                    "Complete raw help/cfg/host streams and native statuses are retained, including opaque bytes and refusals; no guessed or normalized report values",
                    "No target/SDK/worker/GC/allocator/workload setting changed, no unstable flag, source input, emit, link-args or native-static-libs request",
                    "No old version/sysroot/query/component/config intake replay, C-tool guess, bootstrap/dependency/native build, driver/broker/perf/benchmark or Source20/runtime adoption",
                    "Original Actions setup is unchanged and separate; complete effective linker/C headers/config-env/generated-input/native actor-FD/crash/officialEX admission remains unbound",
                ],
                "source_admitted": False, "live_admission": False,
                "capture_ready": False, "evidence_complete": False,
            }
            with (out / "rustc-default-target-observations.json").open("x") as f:
                json.dump(report, f, indent=2)
                f.write("\n")
        finally:
            journal.close()
  
