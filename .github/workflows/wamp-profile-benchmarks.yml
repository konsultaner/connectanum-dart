name: WAMP Profile Benchmarks

on:
  push:
    branches:
      - add-router
      - master
    paths:
      - .github/workflows/wamp-profile-benchmarks.yml
      - bin/wamp-profile-validate
      - bin/check-bench-artifacts
      - native/bench/**
      - native/transport/**
      - packages/connectanum_bench/**
      - packages/connectanum_client/**
      - packages/connectanum_core/**
      - packages/connectanum_router/**
      - pubspec.yaml
  workflow_dispatch:
    inputs:
      campaign:
        description: Canonical profile gates, full paired FlatBuffers campaign or a Linux diagnostic
        required: true
        default: profiles
        type: choice
        options:
          - profiles
          - flatbuffers_primary
          - flatbuffers_diagnostic
          - flatbuffers_extensions
          - flatbuffers_profile
          - flatbuffers_vm_profile
          - flatbuffers_payload_repro
          - flatbuffers_payload_focus
          - flatbuffers_native_view_probe
          - flatbuffers_encoder_component
          - flatbuffers_rss_control
          - flatbuffers_dictionary_component
          - flatbuffers_toolchain_preflight
          - flatbuffers_compiler_inputs
          - flatbuffers_linkage_inputs
          - flatbuffers_wrapper_delegates
          - flatbuffers_cargo_config_inputs
          - flatbuffers_rustc_default_target
          - flatbuffers_linker_candidate_inputs
      baseline_ref:
        description: Full baseline commit SHA used only for the dictionary component
        required: false
        default: ''
        type: string
      rss_case:
        description: Canonical case used only by the fresh-process RSS diagnostic
        required: false
        default: rpc_rawsocket_clear_native_native_buffer
        type: choice
        options:
          - rpc_rawsocket_clear_dart_values
          - rpc_rawsocket_clear_native_native_buffer
      memory_attribution:
        description: Read standard VM memory buckets and owned process maps in RSS control only
        required: false
        default: false
        type: boolean
      allocator_attribution:
        description: Read all-arena glibc counters through diagnostic wrappers in RSS control only
        required: false
        default: false
        type: boolean
      trace_socket_options:
        description: Trace socket options in the original-process payload diagnostic only
        required: false
        default: false
        type: boolean
      profile_case:
        description: Canonical case used only by the CPU profiling diagnostic
        required: false
        default: rpc_rawsocket_clear_native_native_buffer
        type: choice
        options:
          - rpc_rawsocket_clear_dart_values
          - rpc_rawsocket_clear_native_native_buffer
          - rpc_rawsocket_clear_native_pre_encoded_span
          - ext_08_payload_sizes
          - ext_07_small_control
          - ext_22_progressive
          - ext_44_encrypted_progressive_results
      router_worker_counts:
        description: Router worker counts passed to the bench orchestrator
        required: false
        default: "1"
        type: string
      native_runtime_thread_counts:
        description: Tokio runtime thread counts passed to the bench orchestrator
        required: false
        default: "1"
        type: string
      workload_timeout_ms:
        description: Per-workload timeout in milliseconds
        required: false
        default: "300000"
        type: string

permissions:
  contents: read

env:
  CI: true

jobs:
  linux-wamp-profile:
    name: Linux WAMP profile gates
    if: github.event_name != 'workflow_dispatch' || inputs.campaign == 'profiles'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - uses: dart-lang/setup-dart@v1

      - uses: dtolnay/rust-toolchain@stable

      - name: Bootstrap workspace
        run: bin/bootstrap

      - name: Run canonical WAMP profile gates
        env:
          INPUT_ROUTER_WORKER_COUNTS: ${{ github.event.inputs.router_worker_counts || '1' }}
          INPUT_NATIVE_RUNTIME_THREAD_COUNTS: ${{ github.event.inputs.native_runtime_thread_counts || '1' }}
          INPUT_WORKLOAD_TIMEOUT_MS: ${{ github.event.inputs.workload_timeout_ms || '300000' }}
        run: |
          set -euo pipefail
          bin/wamp-profile-validate \
            --out-dir "${GITHUB_WORKSPACE}/out/wamp-profile-validation" \
            --router-worker-counts "$INPUT_ROUTER_WORKER_COUNTS" \
            --native-runtime-thread-counts "$INPUT_NATIVE_RUNTIME_THREAD_COUNTS" \
            --workload-timeout-ms "$INPUT_WORKLOAD_TIMEOUT_MS"

      - name: Upload WAMP profile artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wamp-profile-benchmark-artifacts
          path: out/wamp-profile-validation
          if-no-files-found: error

  linux-flatbuffers-primary:
    name: ${{ inputs.campaign == 'flatbuffers_dictionary_component' && 'FlatBuffers dictionary component' || matrix.shard != 'all' && format('Supplemental FlatBuffers ({0})', matrix.shard) || (inputs.campaign == 'flatbuffers_rss_control' && format('{0} ({1})', inputs.allocator_attribution && 'Allocator attribution' || inputs.memory_attribution && 'Memory attribution' || 'Fresh-process RSS', inputs.rss_case) || inputs.campaign == 'flatbuffers_payload_focus' && 'Focused TLS payload stall reproduction' || (inputs.campaign == 'flatbuffers_payload_repro' && 'FlatBuffers payload stall reproduction' || (inputs.campaign == 'flatbuffers_primary' && 'Full paired FlatBuffers campaign' || 'Paired FlatBuffers diagnostic'))) }}
    if: github.event_name == 'workflow_dispatch' && (inputs.campaign == 'flatbuffers_primary' || inputs.campaign == 'flatbuffers_diagnostic' || inputs.campaign == 'flatbuffers_extensions' || inputs.campaign == 'flatbuffers_payload_repro' || inputs.campaign == 'flatbuffers_payload_focus' || inputs.campaign == 'flatbuffers_rss_control' || inputs.campaign == 'flatbuffers_dictionary_component')
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.campaign == 'flatbuffers_extensions' && '["protocol","payload_sizes","encrypted_progressive_results"]' || '["all"]') }}
    # Each job keeps one hosted VM/process set; source revisions finish independently.
    concurrency:
      group: wamp-${{ inputs.campaign == 'flatbuffers_dictionary_component' && format('flatbuffers-dictionary-component-{0}', github.sha) || matrix.shard != 'all' && format('flatbuffers-extension-{0}-{1}', matrix.shard, github.sha) || (inputs.campaign == 'flatbuffers_rss_control' && format('flatbuffers-rss-control-{0}-{1}', github.sha, inputs.rss_case) || inputs.campaign == 'flatbuffers_payload_focus' && 'flatbuffers-payload-focus' || (inputs.campaign == 'flatbuffers_primary' && format('flatbuffers-primary-{0}', github.sha) || (inputs.campaign == 'flatbuffers_payload_repro' && 'flatbuffers-payload-repro' || 'flatbuffers-paired-diagnostic'))) }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5

      - name: Verify dictionary component contracts
        if: inputs.campaign == 'flatbuffers_dictionary_component'
        run: python3 tool/test_benchmark_flatbuffers_dictionary.py

      - name: Verify original-process stall diagnostic contracts
        if: inputs.campaign == 'flatbuffers_payload_repro' || inputs.campaign == 'flatbuffers_payload_focus'
        run: |
          python3 tool/test_wamp_stall_vm_services.py
          python3 tool/test_wamp_stall_linux.py
          python3 tool/test_wamp_stall_tcp_info.py
          python3 tool/test_smoke_wamp_stall_discovery.py
          python3 tool/test_capture_wamp_stall.py
          python3 tool/test_ci_execution.py

      - name: Verify fresh-process RSS diagnostic contracts
        if: inputs.campaign == 'flatbuffers_rss_control'
        run: |
          python3 tool/test_wamp_rss_memory.py
          python3 tool/test_smoke_wamp_stall_discovery.py
          python3 tool/test_diagnose_wamp_rss.py
          python3 tool/test_ci_execution.py

      - name: Prepare owned socket-option trace
        if: inputs.trace_socket_options && (inputs.campaign == 'flatbuffers_payload_repro' || inputs.campaign == 'flatbuffers_payload_focus')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y strace
          mkdir -p out/wamp-flatbuffers-primary/socket-trace-smoke
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          import subprocess
          import sys
          sys.path.insert(0, 'tool')
          from capture_wamp_stall import socket_option_launch, digest
          output = Path('out/wamp-flatbuffers-primary/socket-trace-smoke').resolve()
          command = [sys.executable, '-c', 'import socket; s=socket.socket(); s.setsockopt(socket.SOL_SOCKET,socket.SO_RCVBUF,65536); s.close()']
          launch, metadata = socket_option_launch(command, output, True)
          subprocess.run(launch, check=True, timeout=30)
          trace = output / metadata['path']
          if 'SO_RCVBUF' not in trace.read_text():
              raise SystemExit('Socket trace smoke did not capture its owned option')
          metadata['sha256'] = digest(trace)
          (output / 'result.json').write_text(json.dumps(metadata, indent=2) + '\n')
          PYTHON

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.5

      - uses: dtolnay/rust-toolchain@1.99.0

      - name: Verify effective pinned Rust toolchain
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          actual = subprocess.check_output(['rustc', '--version'], text=True).split()[1]
          if actual != os.environ['RUSTUP_TOOLCHAIN']:
              raise SystemExit(f'Unexpected Rust toolchain: {actual}')
          PY

      - name: Record hosted runner and source
        run: |
          set -euo pipefail
          mkdir -p out/wamp-flatbuffers-primary/setup
          {
            printf 'source_revision=%s\n' "$(git rev-parse HEAD)"
            printf 'runner_image=%s/%s\n' "${ImageOS:?}" "${ImageVersion:?}"
            printf 'uname=%s\n' "$(uname -a)"
            printf 'dart=%s\n' "$(dart --version 2>&1)"
            printf 'rustc=%s\n' "$(rustc --version)"
            cat /proc/cpuinfo
          } > out/wamp-flatbuffers-primary/setup/host-info.txt

      - name: Resolve dependencies and build production executables
        run: |
          set -euo pipefail
          bin/bootstrap 2>&1 | tee out/wamp-flatbuffers-primary/setup/bootstrap.log
          cargo generate-lockfile --manifest-path native/bench/Cargo.toml
          mkdir -p out/wamp-flatbuffers-primary/setup/locks/native/{bench,transport}
          cp pubspec.lock out/wamp-flatbuffers-primary/setup/locks/
          cp native/bench/Cargo.lock out/wamp-flatbuffers-primary/setup/locks/native/bench/
          cp native/transport/Cargo.lock out/wamp-flatbuffers-primary/setup/locks/native/transport/
          cargo build --release --locked --manifest-path native/transport/Cargo.toml -p ct_ffi \
            2>&1 | tee out/wamp-flatbuffers-primary/setup/native-build.log
          cargo build --release --locked --manifest-path native/bench/Cargo.toml --bin http_stream \
            2>&1 | tee out/wamp-flatbuffers-primary/setup/driver-build.log
          cp native/transport/target/release/libct_ffi.so out/wamp-flatbuffers-primary/setup/
          cp native/bench/target/release/http_stream out/wamp-flatbuffers-primary/setup/
          sha256sum out/wamp-flatbuffers-primary/setup/{http_stream,libct_ffi.so} \
            > out/wamp-flatbuffers-primary/setup/artifacts.sha256
          nm -D --defined-only out/wamp-flatbuffers-primary/setup/libct_ffi.so \
            > out/wamp-flatbuffers-primary/setup/native-exports.txt
          python3 - <<'PY'
          from pathlib import Path
          exports = Path('out/wamp-flatbuffers-primary/setup/native-exports.txt').read_text()
          if any(line.split()[-1].startswith('ct_test_') for line in exports.splitlines() if line.split()):
              raise SystemExit('Production benchmark library contains test oracles')
          PY
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Run paired rows with the unchanged policy
        env:
          INPUT_CAMPAIGN: ${{ inputs.campaign }}
          INPUT_EXTENSION_SHARD: ${{ matrix.shard }}
          INPUT_BASELINE_REF: ${{ inputs.baseline_ref }}
          INPUT_TRACE_SOCKET_OPTIONS: ${{ inputs.trace_socket_options }}
          INPUT_RSS_CASE: ${{ inputs.rss_case }}
          INPUT_MEMORY_ATTRIBUTION: ${{ inputs.memory_attribution }}
          INPUT_ALLOCATOR_ATTRIBUTION: ${{ inputs.allocator_attribution }}
        run: |
          set -euo pipefail
          if [[ "$INPUT_CAMPAIGN" == flatbuffers_dictionary_component ]]; then
            [[ "$INPUT_BASELINE_REF" =~ ^[0-9a-f]{40}$ ]] || { echo 'Explicit full baseline SHA required'; exit 1; }
            git fetch --no-tags --depth=1 origin "$INPUT_BASELINE_REF"
            dart analyze packages/connectanum_core/lib/src/serializer/flatbuffers/frame.dart \
              packages/connectanum_core/lib/src/serializer/flatbuffers/message_projection.dart
            python3 tool/benchmark_flatbuffers_dictionary.py \
              --baseline-ref "$INPUT_BASELINE_REF" \
              --output out/wamp-flatbuffers-primary/dictionary-component \
              --native-lib out/wamp-flatbuffers-primary/setup/libct_ffi.so \
              2>&1 | tee out/wamp-flatbuffers-primary/dictionary-component.log
            exit 0
          fi
          if [[ "$INPUT_CAMPAIGN" == flatbuffers_rss_control ]]; then
            memory_args=()
            if [[ "$INPUT_ALLOCATOR_ATTRIBUTION" == true ]]; then
              dart analyze tool/wamp_allocator_probe.dart
              dart run tool/wamp_allocator_probe.dart > out/wamp-flatbuffers-primary/allocator-self-test.json
              python3 - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'tool')
          from wamp_rss_memory import validate_allocator_counters
          data = json.loads(Path('out/wamp-flatbuffers-primary/allocator-self-test.json').read_text())
          counters = [validate_allocator_counters(data[stage], data['before']['pid'])
                      for stage in ('before', 'allocated', 'after_free')]
          # Probe allocation is much larger than glibc's adaptive mmap threshold.
          # Keep original counters; this controlled process is never a workload.
          tolerance = 1024 * 1024
          committed = [row['arena_system_current_bytes'] + row['mmap_bytes'] for row in counters]
          available = [row['arena_free_fast_bytes'] + row['arena_free_rest_bytes'] for row in counters]
          if committed[1] - committed[0] < data['requested_bytes'] - tolerance:
              raise SystemExit('Allocator probe did not observe the controlled allocation')
          released = committed[1] - committed[2] + available[2] - available[1]
          if released < data['requested_bytes'] - tolerance:
              raise SystemExit('Allocator probe did not observe controlled deallocation')
          PY
              python3 tool/smoke_wamp_stall_discovery.py \
                --output out/wamp-flatbuffers-primary/memory-smoke --allocator-attribution
              memory_args=(--allocator-attribution)
            elif [[ "$INPUT_MEMORY_ATTRIBUTION" == true ]]; then
              python3 tool/smoke_wamp_stall_discovery.py \
                --output out/wamp-flatbuffers-primary/memory-smoke --memory-attribution
              memory_args=(--memory-attribution)
            fi
            python3 tool/diagnose_wamp_rss.py \
              --case "$INPUT_RSS_CASE" "${memory_args[@]}" \
              --output out/wamp-flatbuffers-primary/rss-control \
              --driver out/wamp-flatbuffers-primary/setup/http_stream \
              --native-lib out/wamp-flatbuffers-primary/setup/libct_ffi.so \
              2>&1 | tee out/wamp-flatbuffers-primary/rss-control.log
            exit 0
          fi
          diagnostic_args=()
          if [[ "$INPUT_CAMPAIGN" == flatbuffers_diagnostic ]]; then
            diagnostic_args=(
              --diagnostic
              --case rpc_rawsocket_clear_dart_values
              --case rpc_rawsocket_clear_native_native_buffer
              --case rpc_rawsocket_clear_native_pre_encoded_span
            )
          fi
          if [[ "$INPUT_CAMPAIGN" == flatbuffers_extensions ]]; then
            diagnostic_args=(--diagnostic --extension-diagnostics --extension-shard "$INPUT_EXTENSION_SHARD")
          fi
          if [[ "$INPUT_CAMPAIGN" == flatbuffers_payload_repro ]]; then
            diagnostic_args=(--diagnostic --extension-diagnostics --extension-shard payload_sizes --prepare-only)
          fi
          if [[ "$INPUT_CAMPAIGN" == flatbuffers_payload_focus ]]; then
            # A reduced reproduction, never a complete supplemental/primary gate.
            diagnostic_args=(--diagnostic --extension-diagnostics --prepare-only
              --case ext_15_payload_sizes --case ext_17_payload_sizes --case ext_18_payload_sizes)
          fi
          python3 tool/run_wamp_serializer_campaign.py \
            --output out/wamp-flatbuffers-primary/campaign \
            --driver out/wamp-flatbuffers-primary/setup/http_stream \
            --native-lib out/wamp-flatbuffers-primary/setup/libct_ffi.so \
            --runner-image "github-hosted/${ImageOS:?}/${ImageVersion:?}" \
            --warmups 3 --repetitions 7 --duration-ms 10000 --samples 1000 \
            "${diagnostic_args[@]}" \
            --concurrency 1 --in-flight 1 --router-workers 1 --native-threads 1 \
            --workload-timeout-ms 300000 --campaign-timeout-seconds 19800 \
            2>&1 | tee out/wamp-flatbuffers-primary/campaign.log
          if [[ "$INPUT_CAMPAIGN" == flatbuffers_payload_repro || "$INPUT_CAMPAIGN" == flatbuffers_payload_focus ]]; then
            python3 - <<'PY' 2>&1 | tee out/wamp-flatbuffers-primary/stall-repro.log
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          root = Path('out/wamp-flatbuffers-primary')
          manifest = json.loads((root / 'campaign/manifest.json').read_text())
          subprocess.run([
              sys.executable, 'tool/smoke_wamp_stall_discovery.py',
              '--output', str(root / 'original-process-smoke'),
          ], check=True)
          raise SystemExit(subprocess.run([
              sys.executable, 'tool/capture_wamp_stall.py',
              '--scenario', str(root / 'campaign/scenarios'),
              '--driver', str(root / 'setup/http_stream'),
              '--native-lib', str(root / 'setup/libct_ffi.so'),
              '--router-config', str(root / 'campaign/inputs/router_config.json'),
              '--output', str(root / 'stall-repro'),
              '--original-processes',
              *(['--trace-socket-options'] if os.environ.get('INPUT_TRACE_SOCKET_OPTIONS') == 'true' else []),
              '--control-base', 'https://127.0.0.1:8080/bench',
              '--max-seconds', '19800',
          ]).returncode)
          PY
          fi

      - name: Summarize completed rows and acceptance
        if: always()
        env:
          INPUT_CAMPAIGN: ${{ inputs.campaign }}
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path
          root = Path('out/wamp-flatbuffers-primary/campaign')
          print('## Paired FlatBuffers campaign\n')
          if os.environ.get('INPUT_CAMPAIGN') == 'flatbuffers_dictionary_component':
              path = root.parent / 'dictionary-component/result.json'
              print('Balanced private model-decoding component. This never establishes transport or primary parity.\n')
              if path.exists():
                  data = json.loads(path.read_text())
                  print(f"Component: {data['status']}; retained rows: {data.get('rows')}; baseline: {data['baseline']}.\n")
                  print(json.dumps(data.get('summary', {}), indent=2))
              else:
                  print('Component did not produce a result; setup logs retain the failure.')
              raise SystemExit(0)
          if os.environ.get('INPUT_CAMPAIGN') == 'flatbuffers_rss_control':
              path = root.parent / 'rss-control/result.json'
              print('Fresh process pairs isolate RSS history. This never establishes parity or replaces primary gates.\n')
              if path.exists():
                  data = json.loads(path.read_text())
                  print(f"Diagnostic: {data['status']}; case: {data.get('case_id')}; memory attribution: {data.get('memory_attribution', False)}; allocator attribution: {data.get('allocator_attribution', False)}; complete process pairs: {sum(p['status'] == 'complete' for p in data['pairs'])}/6.\n")
              else:
                  print('RSS control did not produce a result; setup logs retain the failure.')
              raise SystemExit(0)
          if os.environ.get('INPUT_CAMPAIGN') in ('flatbuffers_payload_repro', 'flatbuffers_payload_focus'):
              result = root.parent / 'stall-repro/result.json'
              scope = ('Reduced three-case TLS transition schedule'
                       if os.environ.get('INPUT_CAMPAIGN') == 'flatbuffers_payload_focus'
                       else 'Complete original payload-size schedule')
              print(f'{scope} with opt-in owned-process observations. This never establishes acceptance.\n')
              if result.exists():
                  data = json.loads(result.read_text())
                  print(f"Replay: {data['status']}. Rows: {data['rows']}/{data['expected_rows']}. Driver exit: {data['driver_exit_code']}.\n")
                  print(f"Captured stalls: {len(data['stalls'])}. All raw reports, stacks and failures are retained.\n")
              else:
                  print('Replay did not produce a result; setup and diagnostic logs retain the failure.')
              raise SystemExit(0)
          manifest = root / 'manifest.json'
          if not manifest.exists():
              print('Campaign did not start. Setup logs are retained in the artifact.')
          else:
              data = json.loads(manifest.read_text())
              runs = data['warmup_runs'] + data['measured_runs']
              rows = sum(run['rows_completed'] for run in runs)
              expected = sum(len(run['order']) for run in runs)
              print(f"Mode: {data['metadata']['campaign_kind']}. Completed rows: {rows}/{expected}. Execution: {data['execution']['status']}.\n")
              if data['metadata']['campaign_kind'] in ('diagnostic', 'extension_diagnostic'):
                  print('Diagnostic runs never establish primary acceptance.\n')
              result = root / 'comparison.json'
              if result.exists():
                  report = json.loads(result.read_text())
                  findings = report['findings']
                  if report.get('performance_findings'):
                      print(f"Supplemental performance costs: {len(report['performance_findings'])}; retained per case in comparison.md.\n")
                  print(f"Result: {report['status']}. Findings: {len(findings)}.\n")
                  for finding in findings[:20]:
                      print(f'- {finding}')
                  if len(findings) > 20:
                      print('\nAll remaining findings are retained in comparison.json and comparison.md.')
              else:
                  print('Acceptance is unproven; no comparison report was produced.')
          print('\nThe scheduled matrix, source/artifact hashes, resolved locks, raw reports and failure logs are retained.')
          PY

      - name: Upload full campaign evidence even after failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wamp-flatbuffers-primary-${{ github.sha }}-${{ github.run_attempt }}${{ matrix.shard != 'all' && format('-{0}', matrix.shard) || '' }}
          path: out/wamp-flatbuffers-primary
          if-no-files-found: error
          retention-days: 30

  merge-flatbuffers-extensions:
    name: Complete supplemental FlatBuffers report
    if: always() && github.event_name == 'workflow_dispatch' && inputs.campaign == 'flatbuffers_extensions'
    needs: linux-flatbuffers-primary
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
      - name: Select latest atomic case-batch artifacts from this run
        id: batches
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REPOSITORY: ${{ github.repository }}
          INPUT_RUN_ID: ${{ github.run_id }}
          INPUT_SOURCE: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p out
          gh api --paginate --slurp "repos/$INPUT_REPOSITORY/actions/runs/$INPUT_RUN_ID/artifacts" > out/extension-artifacts.json
          python3 tool/merge_wamp_extension_campaigns.py select-artifacts \
            --metadata out/extension-artifacts.json --source "$INPUT_SOURCE" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.batches.outputs.artifact_ids }}
          path: out/extension-case-batches
          merge-multiple: false
      - name: Recompute the complete supplemental inventory
        env:
          INPUT_SOURCE: ${{ github.sha }}
          INPUT_JOBS_RESULT: ${{ needs.linux-flatbuffers-primary.result }}
        run: |
          python3 tool/merge_wamp_extension_campaigns.py merge \
            --root out/extension-case-batches --source "$INPUT_SOURCE" \
            --jobs-result "$INPUT_JOBS_RESULT" --output out/flatbuffers-extensions
      - name: Publish complete scope and validation summary
        if: always()
        run: |
          if [[ -f out/flatbuffers-extensions/comparison.md ]]; then
            cat out/flatbuffers-extensions/comparison.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Supplemental inventory is incomplete. Case-batch artifacts and aggregation logs retain the failure.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: wamp-flatbuffers-extensions-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            out/flatbuffers-extensions
            out/extension-artifacts.json
          if-no-files-found: error
          retention-days: 30

  linux-flatbuffers-cpu-profile:
    name: FlatBuffers CPU profiles
    if: github.event_name == 'workflow_dispatch' && (inputs.campaign == 'flatbuffers_profile' || inputs.campaign == 'flatbuffers_vm_profile')
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
      INPUT_NATIVE_PERF: ${{ inputs.campaign == 'flatbuffers_profile' && 'true' || 'false' }}
    timeout-minutes: 30
    concurrency:
      group: wamp-flatbuffers-cpu-profile
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.5
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Verify effective pinned Rust toolchain
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          actual = subprocess.check_output(['rustc', '--version'], text=True).split()[1]
          if actual != os.environ['RUSTUP_TOOLCHAIN']:
              raise SystemExit(f'Unexpected Rust toolchain: {actual}')
          PY
      - name: Prepare profiling tools and source
        run: |
          set -euo pipefail
          mkdir -p out/wamp-flatbuffers-profile/setup
          bin/bootstrap 2>&1 | tee out/wamp-flatbuffers-profile/setup/bootstrap.log
          if [[ "$INPUT_NATIVE_PERF" == true ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y linux-tools-generic
            perf_path="$(python3 -c 'import os, sys; from pathlib import Path; paths = [p for p in Path(sys.argv[1]).glob("*/perf") if p.is_file() and os.access(p, os.X_OK)]; print(sorted(paths)[-1].resolve())' /usr/lib/linux-tools)"
            test -n "$perf_path"
            sudo -n "$perf_path" --version
            echo "CONNECTANUM_PROFILE_PERF=$perf_path" >> "$GITHUB_ENV"
          fi
      - name: Verify CPU diagnostic contracts
        run: |
          set -euo pipefail
          python3 tool/test_wamp_profile_window.py
          python3 tool/test_profile_wamp_serializers.py
      - name: Build native symbols for profiling
        env:
          RUSTFLAGS: -C force-frame-pointers=yes -C debuginfo=1
        run: |
          set -euo pipefail
          cargo build --release --locked --manifest-path native/transport/Cargo.toml -p ct_ffi \
            2>&1 | tee out/wamp-flatbuffers-profile/setup/native-build.log
          cp native/transport/target/release/libct_ffi.so out/wamp-flatbuffers-profile/setup/
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: Capture CPU stacks and diagnostic heap snapshots
        env:
          RUSTFLAGS: -C force-frame-pointers=yes -C debuginfo=1
          INPUT_PROFILE_CASE: ${{ inputs.profile_case || 'rpc_rawsocket_clear_native_native_buffer' }}
        run: |
          set -euo pipefail
          profile_args=(
            --output out/wamp-flatbuffers-profile/cpu
            --native-lib out/wamp-flatbuffers-profile/setup/libct_ffi.so
          )
          if [[ "$INPUT_NATIVE_PERF" == true ]]; then
            profile_args+=(--perf "$CONNECTANUM_PROFILE_PERF" --native-call-graph fp)
          fi
          python3 tool/profile_wamp_serializers.py \
            "${profile_args[@]}" \
            --memory \
            --case "$INPUT_PROFILE_CASE" \
            2>&1 | tee out/wamp-flatbuffers-profile/capture.log
      - name: Explain profiling scope
        if: always()
        run: |
          echo '## FlatBuffers CPU and memory diagnostic' >> "$GITHUB_STEP_SUMMARY"
          echo 'Completed captures retain Dart CPU samples, existing VM traces, class heaps and process smaps. Failed/partial captures remain incomplete evidence. Memory snapshots surround the workload; GC is requested only after the workload and CPU window. Shared isolate-group heaps must not be summed, and a GC request does not guarantee collection or finalizer completion. Profiling alters execution; these results never establish parity.' >> "$GITHUB_STEP_SUMMARY"
          if [[ "$INPUT_NATIVE_PERF" == true ]]; then
            echo 'Native perf frame-pointer stacks were requested from the library built with frame pointers. SDK/JIT or cross-language unwinding may remain incomplete; Dart VM CPU samples remain separate.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Dart VM attribution only: Linux native perf stacks are explicitly unmeasured in this capture.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Give the runner ownership of captured perf data
        if: always()
        run: |
          set -euo pipefail
          shopt -s nullglob
          for perf_file in out/wamp-flatbuffers-profile/cpu/*-native.perf; do
            sudo -n chown --reference=out/wamp-flatbuffers-profile/cpu "$perf_file"
            test -r "$perf_file"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: wamp-flatbuffers-cpu-${{ github.sha }}-${{ github.run_attempt }}
          path: out/wamp-flatbuffers-profile
          if-no-files-found: error
          retention-days: 30

  linux-flatbuffers-encoder-component:
    name: Native FlatBuffers codec allocation diagnostic
    if: github.event_name == 'workflow_dispatch' && inputs.campaign == 'flatbuffers_encoder_component'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
    concurrency:
      group: wamp-flatbuffers-encoder-component
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Prepare immutable diagnostic inputs
        run: |
          set -euo pipefail
          mkdir -p out/wamp-encoder-component/setup
          test "$(rustc --version | cut -d ' ' -f 2)" = "$RUSTUP_TOOLCHAIN"
          rustc --version > out/wamp-encoder-component/setup/rustc-version.txt
          cargo generate-lockfile --manifest-path native/transport/Cargo.toml
          cp native/transport/Cargo.lock out/wamp-encoder-component/setup/Cargo.lock
          python3 - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          paths = [p for p in paths if p and Path(p).is_file()]
          paths.append('native/transport/Cargo.lock')
          digest = lambda p: hashlib.sha256(Path(p).read_bytes()).hexdigest()
          data = {'kind': 'native_codec_allocation_components_only_never_acceptance',
                  'head': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                  'inputs': {p: digest(p) for p in paths}}
          Path('out/wamp-encoder-component/setup/inputs.json').write_text(json.dumps(data, indent=2)+'\n')
          PY
      - name: Verify native codec and retain cold and steady observations
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/encoder-component-target"
          cargo test --release --locked --manifest-path native/transport/Cargo.toml \
            -p ct_core flatbuffers \
            2>&1 | tee out/wamp-encoder-component/setup/codec-tests.log
          cargo run --release --locked --manifest-path native/transport/Cargo.toml \
            -p ct_core --example flatbuffers_allocations \
            -- out/wamp-encoder-component/encoder-allocations \
            2> >(tee out/wamp-encoder-component/setup/build.log >&2) \
            | tee out/wamp-encoder-component/encoder-allocations.jsonl
          cargo run --release --locked --manifest-path native/transport/Cargo.toml \
            -p ct_core --example flatbuffers_reader_allocations \
            -- out/wamp-encoder-component/reader-allocations \
            2> >(tee out/wamp-encoder-component/setup/reader-build.log >&2) \
            | tee out/wamp-encoder-component/reader-allocations.jsonl
          cp "$CARGO_TARGET_DIR/release/examples/flatbuffers_allocations" \
            out/wamp-encoder-component/setup/flatbuffers_allocations
          cp "$CARGO_TARGET_DIR/release/examples/flatbuffers_reader_allocations" \
            out/wamp-encoder-component/setup/flatbuffers_reader_allocations
          sha256sum out/wamp-encoder-component/setup/{flatbuffers_allocations,flatbuffers_reader_allocations} \
            > out/wamp-encoder-component/setup/executable.sha256
      - name: Verify source and resolved-input invariance
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          path = Path('out/wamp-encoder-component/setup/inputs.json')
          data = json.loads(path.read_text())
          changed = [p for p, old in data['inputs'].items()
                     if not Path(p).is_file() or hashlib.sha256(Path(p).read_bytes()).hexdigest() != old]
          after = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          result = {'head': data['head'], 'inputs_unchanged': not changed and after == data['head'], 'changed': changed}
          Path('out/wamp-encoder-component/setup/invariance.json').write_text(json.dumps(result, indent=2)+'\n')
          if not result['inputs_unchanged']: raise SystemExit('Component inputs changed')
          PY
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: Explain component scope
        if: always()
        run: |
          echo '## Native codec allocation diagnostic' >> "$GITHUB_STEP_SUMMARY"
          echo 'Reports first-use allocation requests separately from ten steady observations for both encoding and parsing, retaining complete wires, routing-field checks and borrowed-pointer assertions. Standard Rust dependencies and compiler remain unchanged. These are neither Dart allocation metrics nor performance, RSS, E2EE or copy-accounting acceptance; the original primary and supplemental campaigns remain required.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: wamp-encoder-component-${{ github.sha }}-${{ github.run_attempt }}
          path: out/wamp-encoder-component
          if-no-files-found: error
          retention-days: 30

