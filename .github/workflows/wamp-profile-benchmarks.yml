name: WAMP Profile Benchmarks

on:
  push:
    branches:
      - add-router
      - master
    paths:
      - .github/workflows/wamp-profile-benchmarks.yml
      - bin/wamp-profile-validate
      - bin/check-bench-artifacts
      - native/bench/**
      - native/transport/**
      - packages/connectanum_bench/**
      - packages/connectanum_client/**
      - packages/connectanum_core/**
      - packages/connectanum_router/**
      - pubspec.yaml
  workflow_dispatch:
    inputs:
      campaign:
        description: Canonical profile gates, full paired FlatBuffers campaign or a Linux diagnostic
        required: true
        default: profiles
        type: choice
        options:
          - profiles
          - flatbuffers_primary
          - flatbuffers_diagnostic
          - flatbuffers_extensions
          - flatbuffers_profile
      router_worker_counts:
        description: Router worker counts passed to the bench orchestrator
        required: false
        default: "1"
        type: string
      native_runtime_thread_counts:
        description: Tokio runtime thread counts passed to the bench orchestrator
        required: false
        default: "1"
        type: string
      workload_timeout_ms:
        description: Per-workload timeout in milliseconds
        required: false
        default: "300000"
        type: string

permissions:
  contents: read

env:
  CI: true

jobs:
  linux-wamp-profile:
    name: Linux WAMP profile gates
    if: github.event_name != 'workflow_dispatch' || inputs.campaign == 'profiles'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - uses: dart-lang/setup-dart@v1

      - uses: dtolnay/rust-toolchain@stable

      - name: Bootstrap workspace
        run: bin/bootstrap

      - name: Run canonical WAMP profile gates
        env:
          INPUT_ROUTER_WORKER_COUNTS: ${{ github.event.inputs.router_worker_counts || '1' }}
          INPUT_NATIVE_RUNTIME_THREAD_COUNTS: ${{ github.event.inputs.native_runtime_thread_counts || '1' }}
          INPUT_WORKLOAD_TIMEOUT_MS: ${{ github.event.inputs.workload_timeout_ms || '300000' }}
        run: |
          set -euo pipefail
          bin/wamp-profile-validate \
            --out-dir "${GITHUB_WORKSPACE}/out/wamp-profile-validation" \
            --router-worker-counts "$INPUT_ROUTER_WORKER_COUNTS" \
            --native-runtime-thread-counts "$INPUT_NATIVE_RUNTIME_THREAD_COUNTS" \
            --workload-timeout-ms "$INPUT_WORKLOAD_TIMEOUT_MS"

      - name: Upload WAMP profile artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wamp-profile-benchmark-artifacts
          path: out/wamp-profile-validation
          if-no-files-found: error

  linux-flatbuffers-primary:
    name: ${{ inputs.campaign == 'flatbuffers_primary' && 'Full paired FlatBuffers campaign' || 'Paired FlatBuffers diagnostic' }}
    if: github.event_name == 'workflow_dispatch' && (inputs.campaign == 'flatbuffers_primary' || inputs.campaign == 'flatbuffers_diagnostic' || inputs.campaign == 'flatbuffers_extensions')
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    concurrency:
      group: wamp-${{ inputs.campaign == 'flatbuffers_primary' && 'flatbuffers-primary' || 'flatbuffers-diagnostic' }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.5

      - uses: dtolnay/rust-toolchain@1.99.0

      - name: Record hosted runner and source
        run: |
          set -euo pipefail
          mkdir -p out/wamp-flatbuffers-primary/setup
          {
            printf 'source_revision=%s\n' "$(git rev-parse HEAD)"
            printf 'runner_image=%s/%s\n' "${ImageOS:?}" "${ImageVersion:?}"
            printf 'uname=%s\n' "$(uname -a)"
            printf 'dart=%s\n' "$(dart --version 2>&1)"
            printf 'rustc=%s\n' "$(rustc --version)"
            cat /proc/cpuinfo
          } > out/wamp-flatbuffers-primary/setup/host-info.txt

      - name: Resolve dependencies and build production executables
        run: |
          set -euo pipefail
          bin/bootstrap 2>&1 | tee out/wamp-flatbuffers-primary/setup/bootstrap.log
          cargo generate-lockfile --manifest-path native/bench/Cargo.toml
          mkdir -p out/wamp-flatbuffers-primary/setup/locks/native/{bench,transport}
          cp pubspec.lock out/wamp-flatbuffers-primary/setup/locks/
          cp native/bench/Cargo.lock out/wamp-flatbuffers-primary/setup/locks/native/bench/
          cp native/transport/Cargo.lock out/wamp-flatbuffers-primary/setup/locks/native/transport/
          cargo build --release --locked --manifest-path native/transport/Cargo.toml -p ct_ffi \
            2>&1 | tee out/wamp-flatbuffers-primary/setup/native-build.log
          cargo build --release --locked --manifest-path native/bench/Cargo.toml --bin http_stream \
            2>&1 | tee out/wamp-flatbuffers-primary/setup/driver-build.log
          cp native/transport/target/release/libct_ffi.so out/wamp-flatbuffers-primary/setup/
          cp native/bench/target/release/http_stream out/wamp-flatbuffers-primary/setup/
          sha256sum out/wamp-flatbuffers-primary/setup/{http_stream,libct_ffi.so} \
            > out/wamp-flatbuffers-primary/setup/artifacts.sha256
          nm -D --defined-only out/wamp-flatbuffers-primary/setup/libct_ffi.so \
            > out/wamp-flatbuffers-primary/setup/native-exports.txt
          python3 - <<'PY'
          from pathlib import Path
          exports = Path('out/wamp-flatbuffers-primary/setup/native-exports.txt').read_text()
          if any(line.split()[-1].startswith('ct_test_') for line in exports.splitlines() if line.split()):
              raise SystemExit('Production benchmark library contains test oracles')
          PY
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Run paired rows with the unchanged policy
        env:
          INPUT_CAMPAIGN: ${{ inputs.campaign }}
        run: |
          set -euo pipefail
          diagnostic_args=()
          if [[ "$INPUT_CAMPAIGN" == flatbuffers_diagnostic ]]; then
            diagnostic_args=(
              --diagnostic
              --case rpc_rawsocket_clear_dart_values
              --case rpc_rawsocket_clear_native_native_buffer
              --case rpc_rawsocket_clear_native_pre_encoded_span
            )
          fi
          if [[ "$INPUT_CAMPAIGN" == flatbuffers_extensions ]]; then
            diagnostic_args=(--diagnostic --extension-diagnostics)
          fi
          python3 tool/run_wamp_serializer_campaign.py \
            --output out/wamp-flatbuffers-primary/campaign \
            --driver out/wamp-flatbuffers-primary/setup/http_stream \
            --native-lib out/wamp-flatbuffers-primary/setup/libct_ffi.so \
            --runner-image "github-hosted/${ImageOS:?}/${ImageVersion:?}" \
            --warmups 3 --repetitions 7 --duration-ms 10000 --samples 1000 \
            "${diagnostic_args[@]}" \
            --concurrency 1 --in-flight 1 --router-workers 1 --native-threads 1 \
            --workload-timeout-ms 300000 --campaign-timeout-seconds 19800 \
            2>&1 | tee out/wamp-flatbuffers-primary/campaign.log

      - name: Summarize completed rows and acceptance
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          root = Path('out/wamp-flatbuffers-primary/campaign')
          print('## Paired FlatBuffers campaign\n')
          manifest = root / 'manifest.json'
          if not manifest.exists():
              print('Campaign did not start. Setup logs are retained in the artifact.')
          else:
              data = json.loads(manifest.read_text())
              runs = data['warmup_runs'] + data['measured_runs']
              rows = sum(run['rows_completed'] for run in runs)
              expected = sum(len(run['order']) for run in runs)
              print(f"Mode: {data['metadata']['campaign_kind']}. Completed rows: {rows}/{expected}. Execution: {data['execution']['status']}.\n")
              if data['metadata']['campaign_kind'] in ('diagnostic', 'extension_diagnostic'):
                  print('Diagnostic runs never establish primary acceptance.\n')
              result = root / 'comparison.json'
              if result.exists():
                  report = json.loads(result.read_text())
                  findings = report['findings']
                  if report.get('performance_findings'):
                      print(f"Supplemental performance costs: {len(report['performance_findings'])}; retained per case in comparison.md.\n")
                  print(f"Result: {report['status']}. Findings: {len(findings)}.\n")
                  for finding in findings[:20]:
                      print(f'- {finding}')
                  if len(findings) > 20:
                      print('\nAll remaining findings are retained in comparison.json and comparison.md.')
              else:
                  print('Acceptance is unproven; no comparison report was produced.')
          print('\nThe scheduled matrix, source/artifact hashes, resolved locks, raw reports and failure logs are retained.')
          PY

      - name: Upload full campaign evidence even after failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wamp-flatbuffers-primary-${{ github.sha }}-${{ github.run_attempt }}
          path: out/wamp-flatbuffers-primary
          if-no-files-found: error
          retention-days: 30

  linux-flatbuffers-cpu-profile:
    name: FlatBuffers CPU profiles
    if: github.event_name == 'workflow_dispatch' && inputs.campaign == 'flatbuffers_profile'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: wamp-flatbuffers-cpu-profile
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.5
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Prepare profiling tools and source
        run: |
          set -euo pipefail
          mkdir -p out/wamp-flatbuffers-profile/setup
          bin/bootstrap 2>&1 | tee out/wamp-flatbuffers-profile/setup/bootstrap.log
          sudo apt-get update -qq
          sudo apt-get install -y linux-tools-generic
          perf_path="$(python3 -c 'import os, sys; from pathlib import Path; paths = [p for p in Path(sys.argv[1]).glob("*/perf") if p.is_file() and os.access(p, os.X_OK)]; print(sorted(paths)[-1].resolve())' /usr/lib/linux-tools)"
          test -n "$perf_path"
          sudo -n "$perf_path" --version
          echo "CONNECTANUM_PROFILE_PERF=$perf_path" >> "$GITHUB_ENV"
      - name: Build native symbols for profiling
        env:
          RUSTFLAGS: -C force-frame-pointers=yes -C debuginfo=1
        run: |
          set -euo pipefail
          cargo build --release --locked --manifest-path native/transport/Cargo.toml -p ct_ffi \
            2>&1 | tee out/wamp-flatbuffers-profile/setup/native-build.log
          cp native/transport/target/release/libct_ffi.so out/wamp-flatbuffers-profile/setup/
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: Capture Dart and native CPU stacks
        env:
          RUSTFLAGS: -C force-frame-pointers=yes -C debuginfo=1
        run: |
          set -euo pipefail
          python3 tool/profile_wamp_serializers.py \
            --output out/wamp-flatbuffers-profile/cpu \
            --native-lib out/wamp-flatbuffers-profile/setup/libct_ffi.so \
            --perf "$CONNECTANUM_PROFILE_PERF" \
            2>&1 | tee out/wamp-flatbuffers-profile/capture.log
      - name: Explain profiling scope
        if: always()
        run: |
          echo '## FlatBuffers CPU diagnostic' >> "$GITHUB_STEP_SUMMARY"
          echo 'Dart CPU samples and Linux perf stacks are retained for all three codecs. Frame pointers, native debug information and profiling alter execution; these results never establish primary parity. Dart JIT addresses may be unresolved in perf; Dart CPU samples are retained separately.' >> "$GITHUB_STEP_SUMMARY"
      - name: Give the runner ownership of captured perf data
        if: always()
        run: |
          set -euo pipefail
          shopt -s nullglob
          for perf_file in out/wamp-flatbuffers-profile/cpu/*-native.perf; do
            sudo -n chown --reference=out/wamp-flatbuffers-profile/cpu "$perf_file"
            test -r "$perf_file"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: wamp-flatbuffers-cpu-${{ github.sha }}-${{ github.run_attempt }}
          path: out/wamp-flatbuffers-profile
          if-no-files-found: error
          retention-days: 30
