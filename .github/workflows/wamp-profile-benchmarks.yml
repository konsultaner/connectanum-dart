name: WAMP Profile Benchmarks

on:
  push:
    branches:
      - add-router
      - master
    paths:
      - .github/workflows/wamp-profile-benchmarks.yml
      - bin/wamp-profile-validate
      - bin/check-bench-artifacts
      - native/bench/**
      - native/transport/**
      - packages/connectanum_bench/**
      - packages/connectanum_client/**
      - packages/connectanum_core/**
      - packages/connectanum_router/**
      - pubspec.yaml
  workflow_dispatch:
    inputs:
      campaign:
        description: Canonical profile gates, full paired FlatBuffers campaign or a Linux diagnostic
        required: true
        default: profiles
        type: choice
        options:
          - profiles
          - flatbuffers_primary
          - flatbuffers_diagnostic
          - flatbuffers_extensions
          - flatbuffers_profile
          - flatbuffers_payload_repro
          - flatbuffers_native_view_probe
      profile_case:
        description: Canonical case used only by the CPU profiling diagnostic
        required: false
        default: rpc_rawsocket_clear_native_native_buffer
        type: choice
        options:
          - rpc_rawsocket_clear_dart_values
          - rpc_rawsocket_clear_native_native_buffer
          - rpc_rawsocket_clear_native_pre_encoded_span
      router_worker_counts:
        description: Router worker counts passed to the bench orchestrator
        required: false
        default: "1"
        type: string
      native_runtime_thread_counts:
        description: Tokio runtime thread counts passed to the bench orchestrator
        required: false
        default: "1"
        type: string
      workload_timeout_ms:
        description: Per-workload timeout in milliseconds
        required: false
        default: "300000"
        type: string

permissions:
  contents: read

env:
  CI: true

jobs:
  linux-wamp-profile:
    name: Linux WAMP profile gates
    if: github.event_name != 'workflow_dispatch' || inputs.campaign == 'profiles'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - uses: dart-lang/setup-dart@v1

      - uses: dtolnay/rust-toolchain@stable

      - name: Bootstrap workspace
        run: bin/bootstrap

      - name: Run canonical WAMP profile gates
        env:
          INPUT_ROUTER_WORKER_COUNTS: ${{ github.event.inputs.router_worker_counts || '1' }}
          INPUT_NATIVE_RUNTIME_THREAD_COUNTS: ${{ github.event.inputs.native_runtime_thread_counts || '1' }}
          INPUT_WORKLOAD_TIMEOUT_MS: ${{ github.event.inputs.workload_timeout_ms || '300000' }}
        run: |
          set -euo pipefail
          bin/wamp-profile-validate \
            --out-dir "${GITHUB_WORKSPACE}/out/wamp-profile-validation" \
            --router-worker-counts "$INPUT_ROUTER_WORKER_COUNTS" \
            --native-runtime-thread-counts "$INPUT_NATIVE_RUNTIME_THREAD_COUNTS" \
            --workload-timeout-ms "$INPUT_WORKLOAD_TIMEOUT_MS"

      - name: Upload WAMP profile artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wamp-profile-benchmark-artifacts
          path: out/wamp-profile-validation
          if-no-files-found: error

  linux-flatbuffers-primary:
    name: ${{ matrix.shard != 'all' && format('Supplemental FlatBuffers ({0})', matrix.shard) || (inputs.campaign == 'flatbuffers_payload_repro' && 'FlatBuffers payload stall reproduction' || (inputs.campaign == 'flatbuffers_primary' && 'Full paired FlatBuffers campaign' || 'Paired FlatBuffers diagnostic')) }}
    if: github.event_name == 'workflow_dispatch' && (inputs.campaign == 'flatbuffers_primary' || inputs.campaign == 'flatbuffers_diagnostic' || inputs.campaign == 'flatbuffers_extensions' || inputs.campaign == 'flatbuffers_payload_repro')
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.campaign == 'flatbuffers_extensions' && '["protocol","payload_sizes","encrypted_progressive_results"]' || '["all"]') }}
    concurrency:
      group: wamp-${{ matrix.shard != 'all' && format('flatbuffers-extension-{0}', matrix.shard) || (inputs.campaign == 'flatbuffers_primary' && 'flatbuffers-primary' || (inputs.campaign == 'flatbuffers_payload_repro' && 'flatbuffers-payload-repro' || 'flatbuffers-paired-diagnostic')) }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.5

      - uses: dtolnay/rust-toolchain@1.99.0

      - name: Verify effective pinned Rust toolchain
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          actual = subprocess.check_output(['rustc', '--version'], text=True).split()[1]
          if actual != os.environ['RUSTUP_TOOLCHAIN']:
              raise SystemExit(f'Unexpected Rust toolchain: {actual}')
          PY

      - name: Record hosted runner and source
        run: |
          set -euo pipefail
          mkdir -p out/wamp-flatbuffers-primary/setup
          {
            printf 'source_revision=%s\n' "$(git rev-parse HEAD)"
            printf 'runner_image=%s/%s\n' "${ImageOS:?}" "${ImageVersion:?}"
            printf 'uname=%s\n' "$(uname -a)"
            printf 'dart=%s\n' "$(dart --version 2>&1)"
            printf 'rustc=%s\n' "$(rustc --version)"
            cat /proc/cpuinfo
          } > out/wamp-flatbuffers-primary/setup/host-info.txt

      - name: Resolve dependencies and build production executables
        run: |
          set -euo pipefail
          bin/bootstrap 2>&1 | tee out/wamp-flatbuffers-primary/setup/bootstrap.log
          cargo generate-lockfile --manifest-path native/bench/Cargo.toml
          mkdir -p out/wamp-flatbuffers-primary/setup/locks/native/{bench,transport}
          cp pubspec.lock out/wamp-flatbuffers-primary/setup/locks/
          cp native/bench/Cargo.lock out/wamp-flatbuffers-primary/setup/locks/native/bench/
          cp native/transport/Cargo.lock out/wamp-flatbuffers-primary/setup/locks/native/transport/
          cargo build --release --locked --manifest-path native/transport/Cargo.toml -p ct_ffi \
            2>&1 | tee out/wamp-flatbuffers-primary/setup/native-build.log
          cargo build --release --locked --manifest-path native/bench/Cargo.toml --bin http_stream \
            2>&1 | tee out/wamp-flatbuffers-primary/setup/driver-build.log
          cp native/transport/target/release/libct_ffi.so out/wamp-flatbuffers-primary/setup/
          cp native/bench/target/release/http_stream out/wamp-flatbuffers-primary/setup/
          sha256sum out/wamp-flatbuffers-primary/setup/{http_stream,libct_ffi.so} \
            > out/wamp-flatbuffers-primary/setup/artifacts.sha256
          nm -D --defined-only out/wamp-flatbuffers-primary/setup/libct_ffi.so \
            > out/wamp-flatbuffers-primary/setup/native-exports.txt
          python3 - <<'PY'
          from pathlib import Path
          exports = Path('out/wamp-flatbuffers-primary/setup/native-exports.txt').read_text()
          if any(line.split()[-1].startswith('ct_test_') for line in exports.splitlines() if line.split()):
              raise SystemExit('Production benchmark library contains test oracles')
          PY
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Run paired rows with the unchanged policy
        env:
          INPUT_CAMPAIGN: ${{ inputs.campaign }}
          INPUT_EXTENSION_SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          diagnostic_args=()
          if [[ "$INPUT_CAMPAIGN" == flatbuffers_diagnostic ]]; then
            diagnostic_args=(
              --diagnostic
              --case rpc_rawsocket_clear_dart_values
              --case rpc_rawsocket_clear_native_native_buffer
              --case rpc_rawsocket_clear_native_pre_encoded_span
            )
          fi
          if [[ "$INPUT_CAMPAIGN" == flatbuffers_extensions ]]; then
            diagnostic_args=(--diagnostic --extension-diagnostics --extension-shard "$INPUT_EXTENSION_SHARD")
          fi
          if [[ "$INPUT_CAMPAIGN" == flatbuffers_payload_repro ]]; then
            diagnostic_args=(--diagnostic --extension-diagnostics --extension-shard payload_sizes --prepare-only)
          fi
          python3 tool/run_wamp_serializer_campaign.py \
            --output out/wamp-flatbuffers-primary/campaign \
            --driver out/wamp-flatbuffers-primary/setup/http_stream \
            --native-lib out/wamp-flatbuffers-primary/setup/libct_ffi.so \
            --runner-image "github-hosted/${ImageOS:?}/${ImageVersion:?}" \
            --warmups 3 --repetitions 7 --duration-ms 10000 --samples 1000 \
            "${diagnostic_args[@]}" \
            --concurrency 1 --in-flight 1 --router-workers 1 --native-threads 1 \
            --workload-timeout-ms 300000 --campaign-timeout-seconds 19800 \
            2>&1 | tee out/wamp-flatbuffers-primary/campaign.log
          if [[ "$INPUT_CAMPAIGN" == flatbuffers_payload_repro ]]; then
            python3 - <<'PY' 2>&1 | tee out/wamp-flatbuffers-primary/stall-repro.log
          import json
          from pathlib import Path
          import subprocess
          import sys
          root = Path('out/wamp-flatbuffers-primary')
          manifest = json.loads((root / 'campaign/manifest.json').read_text())
          raise SystemExit(subprocess.run([
              sys.executable, 'tool/capture_wamp_stall.py',
              '--scenario', str(root / 'campaign/scenarios'),
              '--driver', str(root / 'setup/http_stream'),
              '--native-lib', str(root / 'setup/libct_ffi.so'),
              '--router-config', str(root / 'campaign/inputs/router_config.json'),
              '--output', str(root / 'stall-repro'),
              '--max-seconds', '19800',
          ]).returncode)
          PY
          fi

      - name: Summarize completed rows and acceptance
        if: always()
        env:
          INPUT_CAMPAIGN: ${{ inputs.campaign }}
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path
          root = Path('out/wamp-flatbuffers-primary/campaign')
          print('## Paired FlatBuffers campaign\n')
          if os.environ.get('INPUT_CAMPAIGN') == 'flatbuffers_payload_repro':
              result = root.parent / 'stall-repro/result.json'
              print('Complete original payload-size schedule with opt-in VM stack capture. This never establishes acceptance.\n')
              if result.exists():
                  data = json.loads(result.read_text())
                  print(f"Replay: {data['status']}. Rows: {data['rows']}/{data['expected_rows']}. Driver exit: {data['driver_exit_code']}.\n")
                  print(f"Captured stalls: {len(data['stalls'])}. All raw reports, stacks and failures are retained.\n")
              else:
                  print('Replay did not produce a result; setup and diagnostic logs retain the failure.')
              raise SystemExit(0)
          manifest = root / 'manifest.json'
          if not manifest.exists():
              print('Campaign did not start. Setup logs are retained in the artifact.')
          else:
              data = json.loads(manifest.read_text())
              runs = data['warmup_runs'] + data['measured_runs']
              rows = sum(run['rows_completed'] for run in runs)
              expected = sum(len(run['order']) for run in runs)
              print(f"Mode: {data['metadata']['campaign_kind']}. Completed rows: {rows}/{expected}. Execution: {data['execution']['status']}.\n")
              if data['metadata']['campaign_kind'] in ('diagnostic', 'extension_diagnostic'):
                  print('Diagnostic runs never establish primary acceptance.\n')
              result = root / 'comparison.json'
              if result.exists():
                  report = json.loads(result.read_text())
                  findings = report['findings']
                  if report.get('performance_findings'):
                      print(f"Supplemental performance costs: {len(report['performance_findings'])}; retained per case in comparison.md.\n")
                  print(f"Result: {report['status']}. Findings: {len(findings)}.\n")
                  for finding in findings[:20]:
                      print(f'- {finding}')
                  if len(findings) > 20:
                      print('\nAll remaining findings are retained in comparison.json and comparison.md.')
              else:
                  print('Acceptance is unproven; no comparison report was produced.')
          print('\nThe scheduled matrix, source/artifact hashes, resolved locks, raw reports and failure logs are retained.')
          PY

      - name: Upload full campaign evidence even after failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wamp-flatbuffers-primary-${{ github.sha }}-${{ github.run_attempt }}${{ matrix.shard != 'all' && format('-{0}', matrix.shard) || '' }}
          path: out/wamp-flatbuffers-primary
          if-no-files-found: error
          retention-days: 30

  merge-flatbuffers-extensions:
    name: Complete supplemental FlatBuffers report
    if: always() && github.event_name == 'workflow_dispatch' && inputs.campaign == 'flatbuffers_extensions'
    needs: linux-flatbuffers-primary
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
      - name: Select latest atomic case-batch artifacts from this run
        id: batches
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REPOSITORY: ${{ github.repository }}
          INPUT_RUN_ID: ${{ github.run_id }}
          INPUT_SOURCE: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p out
          gh api --paginate --slurp "repos/$INPUT_REPOSITORY/actions/runs/$INPUT_RUN_ID/artifacts" > out/extension-artifacts.json
          python3 tool/merge_wamp_extension_campaigns.py select-artifacts \
            --metadata out/extension-artifacts.json --source "$INPUT_SOURCE" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.batches.outputs.artifact_ids }}
          path: out/extension-case-batches
          merge-multiple: false
      - name: Recompute the complete supplemental inventory
        env:
          INPUT_SOURCE: ${{ github.sha }}
          INPUT_JOBS_RESULT: ${{ needs.linux-flatbuffers-primary.result }}
        run: |
          python3 tool/merge_wamp_extension_campaigns.py merge \
            --root out/extension-case-batches --source "$INPUT_SOURCE" \
            --jobs-result "$INPUT_JOBS_RESULT" --output out/flatbuffers-extensions
      - name: Publish complete scope and validation summary
        if: always()
        run: |
          if [[ -f out/flatbuffers-extensions/comparison.md ]]; then
            cat out/flatbuffers-extensions/comparison.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Supplemental inventory is incomplete. Case-batch artifacts and aggregation logs retain the failure.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: wamp-flatbuffers-extensions-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            out/flatbuffers-extensions
            out/extension-artifacts.json
          if-no-files-found: error
          retention-days: 30

  linux-flatbuffers-cpu-profile:
    name: FlatBuffers CPU profiles
    if: github.event_name == 'workflow_dispatch' && inputs.campaign == 'flatbuffers_profile'
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
    timeout-minutes: 30
    concurrency:
      group: wamp-flatbuffers-cpu-profile
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.5
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Verify effective pinned Rust toolchain
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          actual = subprocess.check_output(['rustc', '--version'], text=True).split()[1]
          if actual != os.environ['RUSTUP_TOOLCHAIN']:
              raise SystemExit(f'Unexpected Rust toolchain: {actual}')
          PY
      - name: Prepare profiling tools and source
        run: |
          set -euo pipefail
          mkdir -p out/wamp-flatbuffers-profile/setup
          bin/bootstrap 2>&1 | tee out/wamp-flatbuffers-profile/setup/bootstrap.log
          sudo apt-get update -qq
          sudo apt-get install -y linux-tools-generic
          perf_path="$(python3 -c 'import os, sys; from pathlib import Path; paths = [p for p in Path(sys.argv[1]).glob("*/perf") if p.is_file() and os.access(p, os.X_OK)]; print(sorted(paths)[-1].resolve())' /usr/lib/linux-tools)"
          test -n "$perf_path"
          sudo -n "$perf_path" --version
          echo "CONNECTANUM_PROFILE_PERF=$perf_path" >> "$GITHUB_ENV"
      - name: Build native symbols for profiling
        env:
          RUSTFLAGS: -C force-frame-pointers=yes -C debuginfo=1
        run: |
          set -euo pipefail
          cargo build --release --locked --manifest-path native/transport/Cargo.toml -p ct_ffi \
            2>&1 | tee out/wamp-flatbuffers-profile/setup/native-build.log
          cp native/transport/target/release/libct_ffi.so out/wamp-flatbuffers-profile/setup/
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: Capture Dart and native CPU stacks
        env:
          RUSTFLAGS: -C force-frame-pointers=yes -C debuginfo=1
          INPUT_PROFILE_CASE: ${{ inputs.profile_case || 'rpc_rawsocket_clear_native_native_buffer' }}
        run: |
          set -euo pipefail
          python3 tool/profile_wamp_serializers.py \
            --output out/wamp-flatbuffers-profile/cpu \
            --native-lib out/wamp-flatbuffers-profile/setup/libct_ffi.so \
            --perf "$CONNECTANUM_PROFILE_PERF" \
            --case "$INPUT_PROFILE_CASE" \
            2>&1 | tee out/wamp-flatbuffers-profile/capture.log
      - name: Explain profiling scope
        if: always()
        run: |
          echo '## FlatBuffers CPU diagnostic' >> "$GITHUB_STEP_SUMMARY"
          echo 'Dart CPU samples and Linux perf stacks are retained for all three codecs. Frame pointers, native debug information and profiling alter execution; these results never establish primary parity. Dart JIT addresses may be unresolved in perf; Dart CPU samples are retained separately.' >> "$GITHUB_STEP_SUMMARY"
      - name: Give the runner ownership of captured perf data
        if: always()
        run: |
          set -euo pipefail
          shopt -s nullglob
          for perf_file in out/wamp-flatbuffers-profile/cpu/*-native.perf; do
            sudo -n chown --reference=out/wamp-flatbuffers-profile/cpu "$perf_file"
            test -r "$perf_file"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: wamp-flatbuffers-cpu-${{ github.sha }}-${{ github.run_attempt }}
          path: out/wamp-flatbuffers-profile
          if-no-files-found: error
          retention-days: 30

  linux-flatbuffers-native-view-probe:
    name: Native payload lifetime and production copy proofs
    if: github.event_name == 'workflow_dispatch' && inputs.campaign == 'flatbuffers_native_view_probe'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
    concurrency:
      group: wamp-flatbuffers-native-view-probe
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.5
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Verify effective pinned Rust toolchain
        run: |
          python3 - <<'PY'
          import os, subprocess
          actual = subprocess.check_output(['rustc', '--version'], text=True).split()[1]
          if actual != os.environ['RUSTUP_TOOLCHAIN']:
              raise SystemExit(f'Unexpected Rust toolchain: {actual}')
          PY
      - name: Prepare and test diagnostic tooling
        run: |
          set -euo pipefail
          mkdir -p out/wamp-native-ppt-view-setup
          bin/bootstrap 2>&1 | tee out/wamp-native-ppt-view-setup/bootstrap.log
          python3 -m unittest discover -s tool -p test_probe_native_ppt_views.py -v
          python3 -m unittest discover -s tool -p test_check_wamp_owned_copy_live.py -v
      - name: Build isolated ffi-test library
        run: |
          set -euo pipefail
          CARGO_TARGET_DIR="$RUNNER_TEMP/native-view-ffi-test" \
            cargo build --release --locked --manifest-path native/transport/Cargo.toml \
            -p ct_ffi --features ffi-test \
            2>&1 | tee out/wamp-native-ppt-view-setup/native-build.log
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: Validate packed-source and native lease contracts
        run: |
          set -euo pipefail
          export CONNECTANUM_NATIVE_LIB="$RUNNER_TEMP/native-view-ffi-test/release/libct_ffi.so"
          export CONNECTANUM_SKIP_NATIVE_BUILD=1
          dart analyze 2>&1 | tee out/wamp-native-ppt-view-setup/analyze.log
          (cd packages/connectanum_core && dart test \
            test/message_packed_payload_source_test.dart \
            test/message_lazy_payload_regression_test.dart \
            test/message_flatbuffers_ppt_view_test.dart --reporter expanded) \
            2>&1 | tee out/wamp-native-ppt-view-setup/core-contracts.log
          (cd packages/connectanum_client && dart test \
            test/session_lazy_reply_test.dart \
            test/transport/native/native_ppt_payload_lease_test.dart \
            test/transport/native/flatbuffers_profile_test.dart \
            test/transport/native/native_owned_segments_test.dart \
            --concurrency 1 --reporter expanded) \
            2>&1 | tee out/wamp-native-ppt-view-setup/native-contracts.log
          (cd packages/connectanum_bench && dart test \
            test/wamp_flatbuffers_scenario_test.dart --reporter expanded) \
            2>&1 | tee out/wamp-native-ppt-view-setup/bench-lease-contracts.log
      - name: Run source-attributed control and private native prototype
        run: |
          set -euo pipefail
          python3 tool/probe_native_ppt_views.py \
            --output out/wamp-native-ppt-view \
            --native-lib "$RUNNER_TEMP/native-view-ffi-test/release/libct_ffi.so" \
            --resource-lock "$RUNNER_TEMP/native-view-resources/machine.lock" \
            2>&1 | tee out/wamp-native-ppt-view-setup/probe.log
      - name: Build and verify production owned-copy paths
        run: |
          set -euo pipefail
          CARGO_TARGET_DIR="$RUNNER_TEMP/native-owned-copy-production" \
            cargo build --release --locked --manifest-path native/transport/Cargo.toml \
            -p ct_ffi 2>&1 | tee out/wamp-native-ppt-view-setup/production-build.log
          cargo generate-lockfile --manifest-path native/bench/Cargo.toml
          CARGO_TARGET_DIR="$RUNNER_TEMP/native-owned-copy-driver" \
            cargo build --release --locked --manifest-path native/bench/Cargo.toml \
            --bin http_stream 2>&1 | tee out/wamp-native-ppt-view-setup/driver-build.log
          git diff --exit-code
          test -z "$(git status --porcelain)"
          python3 tool/check_wamp_owned_copy_live.py \
            --output out/wamp-native-ppt-copy-proof \
            --native-lib "$RUNNER_TEMP/native-owned-copy-production/release/libct_ffi.so" \
            --driver "$RUNNER_TEMP/native-owned-copy-driver/release/http_stream" \
            --resource-lock "$RUNNER_TEMP/native-view-resources/machine.lock" \
            2>&1 | tee out/wamp-native-ppt-view-setup/copy-proof.log
      - name: Explain diagnostic scope
        if: always()
        run: |
          echo '## Native payload lifetime and production copy proofs' >> "$GITHUB_STEP_SUMMARY"
          echo 'Production binaries without test oracles separately renew all 120 owned E2EE/transcode cases and all 300 short inventory rows. The original strict timing policy must reject these short runs. No performance acceptance is granted.' >> "$GITHUB_STEP_SUMMARY"
          echo 'A private snapshot runs an exact throwing-loader control and six cases each for the unchanged API, structural-anchor prototype and candidate public lease API. The public phase disposes producers, observes actual lease owners and forbids byte-view export; all positive phases validate full echoed bytes and native-owner cleanup. This diagnostic never establishes parity or replaces the original 48-case matrix.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: wamp-native-ppt-view-diagnostic-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            out/wamp-native-ppt-view-setup
            out/wamp-native-ppt-view
            out/wamp-native-ppt-copy-proof
            !out/wamp-native-ppt-view/source/**
            !out/wamp-native-ppt-view/source.tar
          if-no-files-found: error
          retention-days: 30
