      run: |
        python3 - <<'PY'
        import hashlib
        import json
        import os
        from pathlib import Path
        import re
        import subprocess
  
        root = Path.cwd()
        out = root / "out/wamp-flatbuffers-rustc-default-target"
        out.mkdir(parents=True, exist_ok=False)
        (out / "queries").mkdir()
        journal = (out / "operations.jsonl").open("x")
        children = []
  
        def event(row):
            journal.write(json.dumps(row, sort_keys=True) + "\n")
            journal.flush()
  
        def query(label, argv):
            event({"operation": "query_request_before_launch", "label": label, "argv": argv})
            child = subprocess.Popen(argv, cwd=root, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
            children.append(child)
            original = {"label": label, "pid": child.pid, "argv": argv, "handle": child}
            # The original handle is retained before the first stream operation.
            stdout, stderr = child.communicate()
            status = child.wait()
            for suffix, data in [("stdout", stdout), ("stderr", stderr)]:
                with (out / "queries" / (label + "." + suffix)).open("xb") as f:
                    f.write(data)
            row = {k: v for k, v in original.items() if k != "handle"}
            row.update(signed_status=status, same_original_wait=True, wait_may_be_cached=True,
                       stdout_eof=True, stderr_eof=True, stdout_bytes=len(stdout),
                       stderr_bytes=len(stderr), stdout_sha256=hashlib.sha256(stdout).hexdigest(),
                       stderr_sha256=hashlib.sha256(stderr).hexdigest())
            event({"operation": "query_collected", **row})
            if status != 0:
                raise RuntimeError("Terminal query failure: " + label)
            return stdout
  
        try:
            help_raw = query("rustc-help", ["rustc", "--help"])
            try:
                help_text = help_raw.decode("utf-8")
                help_decode_error = None
            except UnicodeDecodeError as error:
                help_text = None
                help_decode_error = str(error)
            paragraphs = []
            if help_text is not None:
                lines = help_text.splitlines()
                starts = [i for i, line in enumerate(lines) if re.match(r"^\s*--print(?:\s|=|$)", line)]
                for start in starts:
                    paragraph = [lines[start]]
                    for line in lines[start + 1:]:
                        if not line.strip() or re.match(r"^\s*(?:--[A-Za-z]|-[A-Za-z](?:\s|,|$))", line):
                            break
                        paragraph.append(line)
                    paragraphs.append("\n".join(paragraph))
            observed_print_section = paragraphs[0] if len(paragraphs) == 1 else None
            observations = {}
            for kind in ["cfg", "host-tuple"]:
                supported = observed_print_section is not None and re.search(
                    r"(?<![A-Za-z0-9_-])" + re.escape(kind) + r"(?![A-Za-z0-9_-])",
                    observed_print_section,
                ) is not None
                if not supported:
                    observations[kind] = {
                        "query_executed": False,
                        "reason": "Exact token not explicitly listed in one unambiguous actual --print help paragraph",
                        "reported_utf8": None,
                    }
                    continue
                raw = query("rustc-print-" + kind, ["rustc", "--print", kind])
                try:
                    text = raw.decode("utf-8")
                    error_text = None
                except UnicodeDecodeError as error:
                    text = None
                    error_text = str(error)
                observations[kind] = {
                    "query_executed": True, "stdout_bytes": len(raw),
                    "stdout_sha256": hashlib.sha256(raw).hexdigest(),
                    "reported_utf8": text, "decode_error": error_text,
                }
            report = {
                "purpose": "NEW original Actions compiler-reported default cfg/host-tuple, no compilation",
                "workflow_revision": os.environ["GITHUB_SHA"],
                "run_id": os.environ["GITHUB_RUN_ID"],
