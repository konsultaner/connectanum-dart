                    "RUNNER_OS", "RUNNER_ARCH", "LD_LIBRARY_PATH", "LD_PRELOAD"]},
                "original_order_references": pending,
                "images": list(images.values()),
                "native_information_queries": [],
                "qualification": [
                    "The two source references and actual saved ELF interpreter fields justify only this bounded acquisition",
                    "Complete saved streams/readbacks and point metadata do not prove original exec, loaded mappings, ABA/origin/authentication, target ABI, cohort or actor/FD closure",
                    "No shell, ldconfig delegate, compiler, cargo, bootstrap or dependency recipe is executed by this acquisition script",
                    "DT_NEEDED, symbol versions, effective Cargo linker, C headers and generated-input/runtime authority remain unbound",
                    "No Source20 edits/import/adoption, native build, driver, broker, perf, benchmark or numerical workload",
                    "Original Actions setup remains unchanged; no favorable runner/cohort selection",
                ],
                "source_admitted": False, "live_admission": False,
                "capture_ready": False, "evidence_complete": False,
            }
            with (out / "wrapper-delegate-input-observations.json").open("x") as f:
                json.dump(report, f, indent=2)
                f.write("\n")
        finally:
            journal.close()
  
        PY
    - name: Upload linkage preparation even after failure
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: flatbuffers-wrapper-delegates-${{ github.sha }}-${{ github.run_attempt
          }}
