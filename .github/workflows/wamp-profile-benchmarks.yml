                       "bytes_read": count, "sha256": h.hexdigest(),
                       "before": list(before), "after": list(after), "saved_stream_readback_byteexact": True}
                event({"operation": "input_eof_and_output_writes_returned", **row})
                row["elf_header"] = elf_header_data(dst_fd, count)
            finally:
                # Actual native close results are journaled separately.
                try:
                    if dst_fd is not None:
                        os.close(dst_fd)
                        event({"operation": "destination_close_returned", "fd": dst_fd})
                finally:
                    os.close(src_fd)
                    event({"operation": "source_close_returned", "fd": src_fd})
            return row
  
        try:
            pending = [
                {"path": "/bin/sh", "role": "observed wrapper shebang reference"},
                {"path": "/sbin/ldconfig.real", "role": "observed wrapper exec source reference"},
            ]
            images = {}
            cursor = 0
            while cursor < len(pending):
                request = pending[cursor]
                cursor += 1
                source = Path(request["path"])
                if not source.is_absolute():
                    raise RuntimeError("Actual interpreter reference is not absolute; no guessed search")
                if str(source) in images:
                    images[str(source)]["source_references"].append(request)
                    continue
                event({"operation": "path_observation_request_before_open", **request})
                path_stat = os.lstat(source)
