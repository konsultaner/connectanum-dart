name = "wamp_large_transport_frames_heavy"
description = "Matched local four-serializer snapshot; RawSocket frames use 60 MiB so all four serializers fit the FlatBuffers 64 MiB frame limit."
# Original description = "Manual 24 GiB RPC matrix across native/Dart clients, JSON/MsgPack/CBOR, RawSocket/WebSocket, and clear/TLS transports; RawSocket uses 64 MiB frames and WebSocket uses 8 MiB frames below the default 16 MiB safety cap."


# Generated from native/bench/scenarios/wamp_large_transport_frames_heavy.toml; RawSocket payloads and all four workload names are reduced from 64 to 60 MiB.

[[workloads]]
name = "rawsocket_rpc_msgpack_60m_native"
protocol = "wamp_rawsocket_rpc"
client_impl = "native"
serializer = "msgpack"
path = "bench.rpc.echo"
iterations = 8
concurrency = 1
in_flight_per_session = 1
request_bytes = 62914560

