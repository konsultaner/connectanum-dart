name = "wamp_websocket_fragmentation_throughput"
description = "Sustained native WebSocket and WSS throughput across RPC/pubsub, every serializer, and contiguous versus explicit 4 KiB continuation frames."

[[workloads]]
name = "websocket_rpc_json_4m_native_contiguous"
protocol = "wamp_websocket_rpc"
client_impl = "native"
serializer = "json"
path = "bench.rpc.echo"
iterations = 32
concurrency = 4
in_flight_per_session = 4
request_bytes = 4194304

[[workloads]]
name = "websocket_rpc_json_4m_native_fragmented_4k"
protocol = "wamp_websocket_rpc"
client_impl = "native"
serializer = "json"
path = "bench.rpc.echo"
iterations = 32
concurrency = 4
in_flight_per_session = 4
request_bytes = 4194304
websocket_fragment_size = 4096

