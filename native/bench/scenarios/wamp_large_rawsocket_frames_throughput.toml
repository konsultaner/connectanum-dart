name = "wamp_large_rawsocket_frames_throughput"
description = "Exponent-30 RawSocket RPC frames above the standard 16 MiB WAMP profile ceiling."

[[workloads]]
name = "rawsocket_rpc_msgpack_32m_dart"
protocol = "wamp_rawsocket_rpc"
client_impl = "dart"
serializer = "msgpack"
path = "bench.rpc.echo"
iterations = 4
concurrency = 1
in_flight_per_session = 1
request_bytes = 33554432

[[workloads]]
name = "rawsocket_rpc_msgpack_32m_native"
protocol = "wamp_rawsocket_rpc"
client_impl = "native"
serializer = "msgpack"
path = "bench.rpc.echo"
iterations = 4
concurrency = 1
in_flight_per_session = 1
request_bytes = 33554432

[[workloads]]
name = "rawsocket_rpc_cbor_64m_dart"
protocol = "wamp_rawsocket_rpc"
client_impl = "dart"
serializer = "cbor"
path = "bench.rpc.echo"
iterations = 2
concurrency = 1
in_flight_per_session = 1
request_bytes = 67108864

[[workloads]]
name = "rawsocket_rpc_cbor_64m_native"
protocol = "wamp_rawsocket_rpc"
client_impl = "native"
serializer = "cbor"
path = "bench.rpc.echo"
iterations = 2
concurrency = 1
in_flight_per_session = 1
request_bytes = 67108864
