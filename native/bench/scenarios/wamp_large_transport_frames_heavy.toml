name = "wamp_large_transport_frames_heavy"
description = "Manual 24 GiB RPC matrix across native/Dart clients, JSON/MsgPack/CBOR, RawSocket/WebSocket, and clear/TLS transports; RawSocket uses 64 MiB frames and WebSocket uses 8 MiB frames below the default 16 MiB safety cap."

[[workloads]]
name = "rawsocket_rpc_json_64m_native"
protocol = "wamp_rawsocket_rpc"
client_impl = "native"
serializer = "json"
path = "bench.rpc.echo"
iterations = 8
concurrency = 1
in_flight_per_session = 1
request_bytes = 67108864

[[workloads]]
name = "rawsocket_rpc_msgpack_64m_native"
protocol = "wamp_rawsocket_rpc"
client_impl = "native"
serializer = "msgpack"
path = "bench.rpc.echo"
iterations = 8
concurrency = 1
in_flight_per_session = 1
request_bytes = 67108864

[[workloads]]
name = "rawsocket_rpc_cbor_64m_native"
