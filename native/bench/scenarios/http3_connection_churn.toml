name = "http3_connection_churn"
description = "Diagnostic HTTP/3 connection churn: repeated fresh-client bursts with idle probes; not an RSS leak threshold or production performance gate."

[[workloads]]
name = "churn_warmup"
protocol = "h3"
iterations = 128
concurrency = 4
reuse_connections = false
request_bytes = 1024
response_bytes = 1024
request_chunk_bytes = 1024
response_chunk_bytes = 1024

[[workloads]]
name = "settled_start"
protocol = "h2"
warmup_ms = 8000
iterations = 1
concurrency = 1
request_bytes = 0
response_bytes = 1024
response_chunk_bytes = 1024

