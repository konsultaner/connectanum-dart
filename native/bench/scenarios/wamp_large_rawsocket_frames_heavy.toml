name = "wamp_large_rawsocket_frames_heavy"
description = "High-memory RawSocket frame stress across JSON, MsgPack, and CBOR at 128 MiB and 256 MiB."

[[workloads]]
name = "rawsocket_rpc_json_128m_native"
protocol = "wamp_rawsocket_rpc"
client_impl = "native"
serializer = "json"
path = "bench.rpc.echo"
iterations = 16
concurrency = 1
in_flight_per_session = 1
request_bytes = 134217728

