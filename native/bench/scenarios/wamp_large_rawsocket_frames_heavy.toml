name = "wamp_large_rawsocket_frames_heavy"
description = "Manual high-memory RawSocket frame stress at 128 MiB and 256 MiB."

[[workloads]]
name = "rawsocket_rpc_msgpack_128m_native"
protocol = "wamp_rawsocket_rpc"
client_impl = "native"
serializer = "msgpack"
path = "bench.rpc.echo"
iterations = 2
concurrency = 1
in_flight_per_session = 1
request_bytes = 134217728

[[workloads]]
name = "rawsocket_rpc_cbor_128m_dart"
protocol = "wamp_rawsocket_rpc"
client_impl = "dart"
serializer = "cbor"
path = "bench.rpc.echo"
iterations = 2
concurrency = 1
in_flight_per_session = 1
request_bytes = 134217728

[[workloads]]
name = "rawsocket_rpc_cbor_256m_native"
protocol = "wamp_rawsocket_rpc"
client_impl = "native"
serializer = "cbor"
path = "bench.rpc.echo"
iterations = 1
concurrency = 1
in_flight_per_session = 1
request_bytes = 268435456
