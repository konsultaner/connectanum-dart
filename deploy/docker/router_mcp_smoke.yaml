router:
  session_profiles:
    - name: public-wamp
      auth:
        methods: [anonymous]
    - name: public-http
      auth:
        methods: []
    - name: image-smoke-auth
      realm: image.smoke
      auth:
        methods: [ticket]

  realms:
    - name: image.smoke
      auth:
        authmethods: [anonymous, ticket]
        ticket:
          authenticator: image-smoke-ticket
      roles:
        - name: anonymous
          permissions:
            - uri: ""
              match: prefix
              allow: [subscribe, publish, call, register, unregister]
        - name: member
          permissions:
            - uri: ""
              match: prefix
              allow: [subscribe, publish, call, register, unregister]

  listeners:
    - endpoint: 0.0.0.0:8080
      session_profile: public-wamp
      protocols: [http]
      tls:
        mode: disabled
      http:
        session_profile: public-http
        routes:
          - match:
              path: /auth
              methods: [POST]
            action:
              type: auth
              session_profile: image-smoke-auth
              allow_insecure_transport: true
              token_ttl_ms: 60000
              refresh_token_ttl_ms: 300000
              rotate_refresh_tokens: true
          - match:
              path: /mcp
            action:
              type: mcp
              realm: image.smoke
              session_profile: public-wamp
              options:
                name: router-image-mcp-smoke
                instructions: Neutral router image MCP runtime smoke endpoint.
                include_standard_meta_api: true
                include_pubsub_tools: true
                resource_list_page_size: 10
                resource_template_list_page_size: 10
                prompt_list_page_size: 10
                resources:
                  - uri: connectanum://router-image/context
                    name: router-image-context
                    title: Router Image Context
                    description: Neutral context exposed by the packaged router.
                    mime_type: text/plain
                    text: Router-hosted context from the packaged image.
                  - uri: connectanum://router-image/live-context
                    name: router-image-live-context
                    title: Router Image Live Context
                    description: Procedure-backed context with packaged-router update notices.
                    mime_type: application/json
                    read_procedure: wamp.session.count
                    update_topic: image.smoke.events
                resource_templates:
                  - uri_template: connectanum://router-image/item/{itemId}
                    name: router-image-item
                    title: Router Image Item
                    description: Template for neutral packaged-router items.
                    mime_type: application/json
                    read_procedure: wamp.session.count
                    update_topic: image.smoke.events
                prompts:
                  - name: inspect-router-image
                    title: Inspect Router Image
                    description: Builds a neutral packaged-router inspection prompt.
                    arguments:
                      - name: subject
                        description: Subject to inspect.
                        required: true
                    messages:
                      - role: user
                        text: Inspect {{subject}} using router image context.
                procedures:
                  - procedure: wamp.session.count
                    title: Router Image Smoke Session Count
                    description: Counts the WAMP session visible to this MCP route.
                topics:
                  - topic: image.smoke.events
                    title: Router Image Smoke Events
                    description: Events used to validate the packaged router runtime.
          - match:
              path: /mcp/secure
            action:
              type: mcp
              realm: image.smoke
              session_profile: image-smoke-auth
              options:
                name: router-image-protected-mcp-smoke
                instructions: Neutral protected router image MCP runtime smoke endpoint.
                allow_insecure_transport: true
                include_standard_meta_api: true
                include_pubsub_tools: true
                resource_list_page_size: 10
                resource_template_list_page_size: 10
                prompt_list_page_size: 10
                resources:
                  - uri: connectanum://router-image/context
                    name: router-image-context
                    title: Router Image Context
                    description: Neutral context exposed by the packaged router.
                    mime_type: text/plain
                    text: Router-hosted context from the packaged image.
                  - uri: connectanum://router-image/live-context
                    name: router-image-live-context
                    title: Router Image Live Context
                    description: Procedure-backed context with packaged-router update notices.
                    mime_type: application/json
                    read_procedure: wamp.session.count
                    update_topic: image.smoke.events
                resource_templates:
                  - uri_template: connectanum://router-image/item/{itemId}
                    name: router-image-item
                    title: Router Image Item
                    description: Template for neutral packaged-router items.
                    mime_type: application/json
                    read_procedure: wamp.session.count
                    update_topic: image.smoke.events
                prompts:
                  - name: inspect-router-image
                    title: Inspect Router Image
                    description: Builds a neutral packaged-router inspection prompt.
                    arguments:
                      - name: subject
                        description: Subject to inspect.
                        required: true
                    messages:
                      - role: user
                        text: Inspect {{subject}} using router image context.
                procedures:
                  - procedure: wamp.session.count
                    title: Router Image Smoke Session Count
                    description: Counts the WAMP session visible to this MCP route.
                topics:
                  - topic: image.smoke.events
                    title: Router Image Smoke Events
                    description: Events used to validate the packaged router runtime.
          - match:
              path: /mcp/secure-json
            action:
              type: mcp
              realm: image.smoke
              session_profile: image-smoke-auth
              options:
                name: router-image-protected-json-response-mcp-smoke
                instructions: Neutral protected router image MCP JSON-response smoke endpoint.
                allow_insecure_transport: true
                post_response_transport: json
                include_standard_meta_api: true
                include_pubsub_tools: true
                resource_list_page_size: 1
                resource_template_list_page_size: 1
                prompt_list_page_size: 1
                resources:
                  - uri: connectanum://router-image/archive-context
                    name: router-image-archive-context
                    title: Router Image Archive Context
                    description: Metadata-only pagination sentinel for packaged-router resources.
                    mime_type: text/plain
                    text: Archived router-hosted context.
                  - uri: connectanum://router-image/context
                    name: router-image-context
                    title: Router Image Context
                    description: Neutral context exposed by the packaged router.
                    mime_type: text/plain
                    text: Router-hosted context from the packaged image.
                  - uri: connectanum://router-image/live-context
                    name: router-image-live-context
                    title: Router Image Live Context
                    description: Procedure-backed context with packaged-router update notices.
                    mime_type: application/json
                    read_procedure: wamp.session.count
                    update_topic: image.smoke.events
                resource_templates:
                  - uri_template: connectanum://router-image/archive/{itemId}
                    name: router-image-archive-item
                    title: Router Image Archive Item
                    description: Metadata-only pagination sentinel for packaged-router items.
                    mime_type: application/json
                  - uri_template: connectanum://router-image/item/{itemId}
                    name: router-image-item
                    title: Router Image Item
                    description: Template for neutral packaged-router items.
                    mime_type: application/json
                    read_procedure: wamp.session.count
                    update_topic: image.smoke.events
                prompts:
                  - name: archive-router-image
                    title: Archive Router Image
                    description: Metadata-only pagination sentinel for packaged-router prompts.
                    messages:
                      - role: user
                        text: Archive router image metadata.
                  - name: inspect-router-image
                    title: Inspect Router Image
                    description: Builds a neutral packaged-router inspection prompt.
                    arguments:
                      - name: subject
                        description: Subject to inspect.
                        required: true
                    messages:
                      - role: user
                        text: Inspect {{subject}} using router image context.
                procedures:
                  - procedure: wamp.session.count
                    title: Router Image Smoke Session Count
                    description: Counts the WAMP session visible to this MCP route.
                topics:
                  - topic: image.smoke.events
                    title: Router Image Smoke Events
                    description: Events used to validate the packaged router runtime.

  authenticators:
    anonymous:
      type: anonymous
    image-smoke-ticket:
      type: ticket
      options:
        secrets:
          image-smoke-agent:
            ticket: image-smoke-ticket
            role: member
            provider: router-image-smoke
          image-smoke-peer:
            ticket: image-smoke-peer-ticket
            role: member
            provider: router-image-smoke
